  }
  const z=cellRect(col,row,w,h);
  s+=`<div class="pzone" style="left:${z.x}px;top:${z.y}px;width:${z.w}px;height:${z.h}px"></div>`;
  preview.innerHTML=s;
  preview.classList.add('on');
}
/* Pointer events fire faster than the screen refreshes, so writing layout on
   every one of them does the same work several times before anything is shown.
   Coalesce into one write per frame: the card tracks the cursor exactly, and the
   snapped preview is only touched on the frames where the target cell changes. */
let dragRaf=0,dragPt=null;
function dragMove(e){
  if(!drag)return;
  if(Math.abs(e.clientX-drag.sx)>3||Math.abs(e.clientY-drag.sy)>3)didDrag=true;
  dragPt={x:e.clientX,y:e.clientY};
  if(!dragRaf)dragRaf=requestAnimationFrame(dragFrame);
}
function dragFrame(){
  dragRaf=0;
  if(!drag||!dragPt)return;
  const x=dragPt.x-drag.ox,y=dragPt.y-drag.oy;
  els.get(drag.id).el.style.transform=`translate(${x}px,${y}px)`;
  const{uw,uh,p}=unit();
  // + the carousel offset, or every drop would land one scroll-distance away
  // from the cell the cursor is actually over. Clamped to the EXTENT, not to the
  // visible page: in a scrolling mode you are allowed to aim past the edge.
  const ex=extent();
  const col=Math.max(0,Math.min(ex.c-drag.t.w,Math.round((x+offX-p.x-PAD)/(uw+gap))));
  const row=Math.max(0,Math.min(ex.r-drag.t.h,Math.round((y+offY-p.y-PAD)/(uh+gap))));
  if(!drag.shown||col!==drag.shown.col||row!==drag.shown.row){
    drag.to={col,row};drag.shown={col,row};
    showPreview(col,row,drag.t.w,drag.t.h);
  }
}
/* ---- reorder + repack ----
   The board is a reading order. A drop pins the dragged tile exactly where it was
   released and re-packs every other tile, in reading order, into the first slot
   that fits. Packing is constructive rather than a search, so it always yields a
   valid board — unlike exact placement, which needs a re-tiling that usually does
   not exist once the grid is fully packed. The price is that untouched tiles can
   travel: a tile that no longer fits the gap it used to hold gets leapfrogged by
   a smaller one. */
function overlaps(a,b){return a.col<b.col+b.w&&a.col+a.w>b.col&&a.row<b.row+b.h&&a.row+a.h>b.row;}
/* Page-major, not extent-major. A plain row-by-row scan across the whole extent
   would run the first row three screens to the right before ever starting the
   second — so the visible page would look half-empty while tiles piled up
   off-screen. Fill the page you can see first, then spill to the next one. */
function firstFit(placed,w,h){
  const ex=extent(),free=(c,r)=>{
    const rect={col:c,row:r,w,h};
    return !placed.some(p=>overlaps(rect,p));
  };
  const pw=scrollsX()?cols:ex.c,ph=scrollsY()?rows:ex.r;
  for(let r0=0;r0<ex.r;r0+=ph)for(let c0=0;c0<ex.c;c0+=pw){
    const rEnd=Math.min(r0+ph,ex.r)-h,cEnd=Math.min(c0+pw,ex.c)-w;
    for(let r=r0;r<=rEnd;r++)for(let c=c0;c<=cEnd;c++)if(free(c,r))return{col:c,row:r};
  }
  // A tile taller or wider than one page fits no page, but may still fit the
  // extent across a page boundary — so fall back to a plain scan before giving up.
  for(let r=0;r<=ex.r-h;r++)for(let c=0;c<=ex.c-w;c++)if(free(c,r))return{col:c,row:r};
  return null;
}
function reorderRepack(id,to,size){
  const lim=tierLimit(),ex=extent();
  const onBoard=new Map(grid.tiles.map(t=>[t.id,{...t}]));
  const me=onBoard.get(id);
  if(!me)return null;
  const pinned={...me,col:to.col,row:to.row,...(size||{})};
  if(pinned.col<0||pinned.row<0||pinned.col+pinned.w>ex.c||pinned.row+pinned.h>ex.r)return null;
  /* The roster is every card that belongs on the board at this size, not just the
     ones currently placed. Without that, an evicted tile is gone for good: the
     headline is 15 cells and will never find a 5x3 hole again once it is off.
     A tile ON the board keeps the size it currently has, not the size it was
     authored at — otherwise the first repack after any resize silently undoes it.
     Only a tile that is off the board comes back at its authored size. */
  const reading=CARDS.filter(c=>c.tier<=lim&&c.id!==id).map(c=>{
    const t=onBoard.get(c.id);
    const cs=cardSize(c);
    return{id:c.id,tier:c.tier,w:Math.min(t?t.w:cs.w,cols),h:Math.min(t?t.h:cs.h,rows),
           row:t?t.row:Infinity,col:t?t.col:Infinity};
  }).sort((a,b)=>a.row-b.row||a.col-b.col||(a.id<b.id?-1:1));
  /* LINEAR, one pass. Reading order, each tile into the first slot that fits;
     whatever is still unplaced when the board runs out is dropped, in that same
     order. So the tiles at the END of the board are the ones that go — which is
     what anyone watching predicts.
     This replaces a packer that tried three different orderings and kept
     whichever evicted the least "valuable" tiles. It packed better and behaved
     unpredictably: the same drop could cost you a different tile depending on
     sizes elsewhere on the board. Predictability is worth more than density in a
     thing whose whole job is to be understood. */
  const placed=[pinned],evicted=[];
  for(const t of reading){
    const pos=firstFit(placed,t.w,t.h);
    if(pos)placed.push({...t,...pos});else evicted.push(t.id);
  }
  return{placed,evicted};
}
/* Restricted means no tile may ever leave the board, so an arrangement that
   would cost one is refused outright and the caller rolls back. Every other
   overflow mode accepts the repack — under the scrolling modes `evicted` is
   almost always empty anyway, because the extent gave the packer somewhere to
   put the spill. */
function repackAllowed(rr){return !!rr&&!(ovf==='restrict'&&rr.evicted.length>0);}
function applyLayout(placed){
  const g=newGrid();
  for(const t of placed)g.addTile({id:t.id,col:t.col,row:t.row,w:t.w,h:t.h});
  grid=g;
}

/* An eviction is not permanent. Once a tile is off the board the minimal-move
   solver never reconsiders it — it only knows about tiles already placed — so the
   board would keep drifting emptier. After any successful drop, if a card that
   belongs on the board is missing, repack the whole thing (pinning the tile the
   user just placed) to make room for it again. */
function heal(id){
  const lim=tierLimit();
  if(!CARDS.some(c=>c.tier<=lim&&!grid.getTile(c.id)))return;
  const t=grid.getTile(id);
  if(!t)return;
  const rr=reorderRepack(id,{col:t.col,row:t.row});
  if(repackAllowed(rr))applyLayout(rr.placed);
}

function dragEnd(){
  if(!drag)return;
  removeEventListener('pointermove',dragMove);
  if(dragRaf){cancelAnimationFrame(dragRaf);dragRaf=0;}
  dragPt=null;
  showPreview(null);
  const el=els.get(drag.id).el;
  el.classList.remove('dragging');el.style.zIndex='';el.style.boxShadow='';
  // captured before anything mutates, so Undo restores the whole board and not
  // merely the dragged tile — a drop can move half a dozen windows
  const wasBoard=grid.toJSON();
  if(mode==='overlap'){
    overlapMove(drag.id,drag.to);
    showToast('landed · overlapping',wasBoard);
  } else if(mode==='shove'){
    // Griddle's moveTile: it shoves whatever is in the way, and refuses the drop
    // when a neighbour has nowhere to go.
    const wasAt=new Map(grid.tiles.map(t=>[t.id,t.col+','+t.row]));
    grid.moveTile(drag.id,drag.to);
    flashMoved(grid.tiles.filter(t=>t.id!==drag.id&&wasAt.get(t.id)!==t.col+','+t.row).length,wasBoard);
  } else if(mode==='reflow'){
    // Same solver the desktop app uses: land the dragged window exactly where
    // it was aimed and move as few neighbours as possible to make room.
    const others=grid.tiles.filter(t=>t.id!==drag.id).map(t=>({id:t.id,col:t.col,row:t.row,w:t.w,h:t.h}));
    const target={id:drag.id,col:drag.to.col,row:drag.to.row,w:drag.t.w,h:drag.t.h};
    const res=solveMinimalMoves(others,target,{cols,rows});
    if(res&&res.ok){
      // Apply the solved arrangement wholesale. Replaying it move-by-move would
      // re-run Griddle's own collision resolution on each step and land
      // somewhere else entirely — the plan is only valid as a complete state.
      const moved=new Map(res.moves.map(m=>[m.id,m]));
      const snap=grid.toJSON();
      snap.tiles=[...others.map(t=>{const m=moved.get(t.id);return m?{...t,col:m.col,row:m.row}:t;}),target];
      grid.loadJSON(snap);
      flashMoved(res.movedCount,wasBoard);
      heal(drag.id);
    } else {
      // No exact re-tiling exists — which on a fully packed board is the common
      // case, not the exception. Reflow instead, so the drop always lands.
      const before=new Map(grid.tiles.map(t=>[t.id,t.col+','+t.row]));
      const rr=reorderRepack(drag.id,drag.to);
      if(repackAllowed(rr)){
        applyLayout(rr.placed);
        flashMoved(rr.placed.filter(t=>t.id!==drag.id&&before.get(t.id)!==t.col+','+t.row).length,wasBoard);
        flash(rr.evicted.filter(eid=>!grid.getTile(eid)).length,wasBoard);
      } else if(rr&&ovf==='restrict'){
        // Restricted: the arrangement existed, it just cost a tile. Refuse it and
        // say why, rather than dropping something and hoping it is not noticed.
        grid.moveTile(drag.id,drag.to);
        showToast('no room · nothing dropped',wasBoard);
      } else {
        grid.moveTile(drag.id,drag.to);
      }
    }
  } else if(mode==='griddle'){
    /* Griddle's own handling, untouched. Its moveTile places the drop, then its
       own griddle-v1 reflow tidies the board. No minimal-move solver, no custom
       repack, no heal and no eviction weighting — this is the library deciding on
       its own terms, so what this page adds can be judged against it.
       reflow() throws rather than returning false on an arrangement it cannot
       express, and the move has already been applied by then, so a failure just
       leaves the board as moveTile left it. */
    grid.moveTile(drag.id,drag.to);
    try{
      grid.reflow({strategy:'griddle-v1',cols});
    }catch(err){
      showToast('griddle reflow declined',wasBoard);
    }
  } else {
    grid.moveTile(drag.id,drag.to);
  }
  if(mode==='overlap')raise(drag.id);
  drag=null;sync(reduce?1:440);refreshReset();
  setTimeout(()=>{didDrag=false;},60);
}
/* An expanded tile claims EVERY CELL of the grid — cellRect(0,0,cols,rows) is
   literally the whole board — rather than floating at some fixed pixel size of
   its own. Three things fall out of that for free:
     · it is still a window, sitting exactly where a window can sit, so the page
       never breaks into "grid" and "modal" as two different kinds of surface;
     · it is responsive without a single breakpoint, because the board already
       tracks the viewport (panelRect) — on a phone the same call yields a
       full-bleed sheet;
     · the geometry transition is the same translate+resize every other tile
       runs, so opening a tile is the motion the page has been teaching all along.
   Nothing here hardcodes a size, so changing cols/rows/gap/padding cannot leave
   the popout misaligned with the board behind it.
   Derived from the PANEL rather than from cellRect, so it is immune to both the
   carousel offset and the canvas zoom: an opened tile always covers the board
   area you can see, whatever the board is doing behind it. Otherwise reading a
   tile two screens down would open a sheet that starts off-screen, and zooming
   out would shrink the thing you opened in order to read it. */
function expandRect(){const p=panelRect();
  return{x:p.x+PAD,y:p.y+PAD,w:p.w-PAD*2,h:p.h-PAD*2};}
function expand(id){
  if(!grid.getTile(id))return;
  if(expandedId)collapse(true);
  expandedId=id;
  const el=els.get(id).el;
  el.classList.add('expanded');
  // drops the board clip, so the open tile can out-stack the scrim's blur
  root.classList.add('reading');
  place(id,expandRect(),reduce?1:460);
  scrim.classList.add('on');
}
function collapse(quiet){
  if(!expandedId)return;
  const id=expandedId;expandedId=null;
  const el=els.get(id).el;
  /* Order matters. Dropping .expanded takes z-index:90 with it, so the lift has
     to be in place first or there is a frame where the tile is already back in
     DOM order — under everything — with its whole shrink still ahead of it. */
  el.classList.add('lifted');
  el.classList.remove('expanded');
  const t=grid.getTile(id);
  if(t)place(id,cellRect(t.col,t.row,t.w,t.h),reduce?1:460);
  if(!quiet)scrim.classList.remove('on');
  /* `reading` (which suppresses the board clip) is held until the tile has
     actually landed. Restoring the clip early would make .stage a stacking
     context again mid-flight, trapping the tile below the scrim it is still
     travelling over — the exact bug this pair of classes exists to prevent.
     Guarded on expandedId because a quiet collapse is the first half of
     switching tiles: the next tile has already re-entered reading by the time
     this fires, and it must not be cancelled out from under it. */
  const settled=reduce?20:500;
  setTimeout(()=>{
    el.classList.remove('lifted');
    el.style.zIndex='';
    if(!expandedId)root.classList.remove('reading');
  },settled);
}
function flashMoved(n,snap){
  showToast(n===0?'landed · nothing moved'
    :n===1?'landed · 1 window moved':`landed · ${n} windows moved`,snap);
}
function flash(n,snap){
  if(!n)return;
  showToast(n===1?'1 window did not fit':`${n} windows did not fit`,snap);
}
function applyDims(nc,nr){
  // a pending Undo holds a board sized for the OLD grid; restoring it into a
  // resized one would put tiles outside the board. Retire it with the change.
  hideToast();
  const snap=grid.tiles.map(t=>({...t}));
  cols=nc;rows=nr;
  offX=0;offY=0;zoom=1;   // the page just changed size; any carousel position is stale
  grid=newGrid();
  const ex=extent();
  let dropped=0;
  for(const t of snap){
    const w=Math.min(t.w,cols),h=Math.min(t.h,rows);
    if(!addWithSpill(grid,{id:t.id,col:Math.max(0,Math.min(t.col,ex.c-w)),row:Math.max(0,Math.min(t.row,ex.r-h)),w,h}))dropped++;
  }
  if(mode==='overlap')setFlow(false);   // the rebuild above re-imposed flow
  document.getElementById('colsVal').textContent=cols;
  document.getElementById('rowsVal').textContent=rows;
  renderCells();sync(reduce?1:520);flash(dropped);btns();refreshReset();
}
function btns(){
  document.getElementById('colsDec').disabled=cols<=1;
  document.getElementById('colsInc').disabled=cols>=20;
  document.getElementById('rowsDec').disabled=rows<=1;
  document.getElementById('rowsInc').disabled=rows>=10;
  document.getElementById('gapDec').disabled=gap<=0;
  document.getElementById('gapInc').disabled=gap>=28;
  document.getElementById('radDec').disabled=radius<=0;
  document.getElementById('radInc').disabled=radius>=22;
}
document.getElementById('colsInc').onclick=()=>applyDims(Math.min(20,cols+1),rows);
document.getElementById('colsDec').onclick=()=>applyDims(Math.max(1,cols-1),rows);
document.getElementById('rowsInc').onclick=()=>applyDims(cols,Math.min(10,rows+1));
document.getElementById('rowsDec').onclick=()=>applyDims(cols,Math.max(1,rows-1));
function setGap(v){gap=v;document.getElementById('gapVal').textContent=gap+'px';renderCells();sync(reduce?1:380);btns();refreshReset();}
document.getElementById('gapInc').onclick=()=>setGap(Math.min(28,gap+2));
document.getElementById('gapDec').onclick=()=>setGap(Math.max(0,gap-2));
function setRadius(v){radius=v;root.style.setProperty('--card-radius',radius+'px');
  document.getElementById('radVal').textContent=radius+'px';btns();refreshReset();}
document.getElementById('radInc').onclick=()=>setRadius(Math.min(22,radius+2));
document.getElementById('radDec').onclick=()=>setRadius(Math.max(0,radius-2));
document.getElementById('modeSel').onchange=e=>{
  const was=mode;mode=e.target.value;
  if(started&&was!==mode){
    if(mode==='overlap'){setFlow(false);clearZ();}
    else if(was==='overlap'){
      const lost=settleFromOverlap();setFlow(true);clearZ();sync(reduce?1:460);
      if(lost)flash(lost);
    }
  }
  markOverflowInert();
  refreshReset();
};

/* ---- tile overflow ----
   Changing it changes the EXTENT, and the extent is baked into the Griddle
   instance at construction, so the board is rebuilt rather than mutated. Tiles
   are clamped into whatever the new extent allows: going from a scrolling mode
   back to a paged one has to bring the spill home, or tiles would sit forever in
   cells that no longer exist. */
function rebuildForOverflow(){
  if(!grid)return;
  const tiles=grid.tiles.map(t=>({...t}));
  const ex=extent();
  offX=0;offY=0;
  grid=newGrid();
  let dropped=0;
  for(const t of tiles){
    const w=Math.min(t.w,cols),h=Math.min(t.h,rows);
    const col=Math.max(0,Math.min(t.col,ex.c-w)),row=Math.max(0,Math.min(t.row,ex.r-h));
    if(!addWithSpill(grid,{id:t.id,col,row,w,h}))dropped++;
  }
  if(mode==='overlap')setFlow(false);   // the rebuild above re-imposed flow
  renderCells();sync(reduce?1:420);flash(dropped);refreshReset();
}
/* Overlap never contests space, so nothing can ever fail to fit and the whole
   overflow question stops existing. Show that rather than leaving a live-looking
   control that silently does nothing. */
function markOverflowInert(){
  const c=document.getElementById('ovfSel').closest('.ctl');
  const inert=mode==='overlap';
  c.classList.toggle('inert',inert);
  document.getElementById('ovfSel').disabled=inert;
  c.title=inert?'Overlap never runs out of room, so overflow does not apply':'';
}
document.getElementById('ovfSel').onchange=e=>{
  ovf=e.target.value;zoom=1;
  root.classList.toggle('canvasmode',ovf==='canvas');
  if(started)rebuildForOverflow();else{offX=0;offY=0;}
  refreshReset();
};

/* ---- apply a template ----
   The template's dimensions win: the grid is RE-DIMENSIONED to the template's
   cols x rows and the slots are used verbatim. Scaling them into whatever the
   grid happened to be would round the rails of "Cockpit" into something that is
   no longer a cockpit — a template describes a shape, and a shape needs its own
   axes. This is what the desktop app does with a mismatched template, and what
   the copy on this tile already claimed.
   Windows map onto the slots in reading order; anything past the last slot
   auto-places into the first gap that fits, exactly as a newly-appeared window
   would. The whole board is captured first, so it lands under one Undo. */
function applyTemplateById(id){
  const t=TEMPLATES.find(x=>x.id===id);
  if(!t||!grid||!started)return;
  const was=grid.toJSON();
  const wasDims=cols+' × '+rows;
  hideToast();
  const slots=t.slots.map(s=>({col:s.col,row:s.row,w:s.w,h:s.h}));

  // reading order first, then anything currently off the board — so applying a
  // template is also a way to get dropped tiles back
  const on=[...grid.tiles].sort((a,b)=>a.row-b.row||a.col-b.col).map(x=>x.id);
  const seq=[...on,...CARDS.filter(c=>c.tier<=tierLimit()&&!on.includes(c.id)).map(c=>c.id)];

  const redimmed=cols!==t.cols||rows!==t.rows;
  cols=t.cols;rows=t.rows;
  document.getElementById('colsVal').textContent=cols;
  document.getElementById('rowsVal').textContent=rows;
  btns();
  offX=0;offY=0;
  grid=newGrid();
  let dropped=0;
  seq.forEach((cid,i)=>{
    const card=CARDS.find(x=>x.id===cid);
    if(i<slots.length){
      const s=slots[i];
      if(grid.addTileWithDisplacement({id:cid,col:s.col,row:s.row,w:s.w,h:s.h}))return;
    }
    const{w,h}=card?cardSize(card):{w:1,h:1};
    const pos=firstFit(grid.tiles.map(x=>({col:x.col,row:x.row,w:x.w,h:x.h})),w,h);
    if(pos)grid.addTile({id:cid,col:pos.col,row:pos.row,w,h});else dropped++;
  });
  if(mode==='overlap')setFlow(false);   // the rebuild above re-imposed flow
  renderCells();
  sync(reduce?1:520,reduce?0:22);
  /* Undo survives only when the dimensions did not change. The snapshot holds a
     board sized for the OLD grid, and restoring it into a re-dimensioned one
     would put tiles outside the board — the same reason applyDims retires it.
     So a re-dimensioning apply says what it did instead of offering a way back
     it cannot honour. */
  const undoable=redimmed?null:was;
  if(dropped)flash(dropped,undoable);
  else if(redimmed)showToast(`${t.name} · grid now ${cols} × ${rows} (was ${wasDims})`);
  else showToast(`applied · ${t.name}`,was);
  refreshReset();
}
/* Delegated, because the buttons live inside card content that is rebuilt, and
   because the same handler then serves both the tile face and the popout. */
addEventListener('click',e=>{
  const b=e.target.closest('[data-tpl]');
  if(!b)return;
  e.stopPropagation();
  applyTemplateById(b.dataset.tpl);
});

/* ---- carousel input ----
   A wheel over the board slides it in whichever direction the mode scrolls. In
   scroll-horizontal a vertical wheel is accepted too: almost nobody has a
   horizontal wheel, and a carousel you cannot move is worse than one that
   interprets you generously. */
let scrollRaf=0,scrollDur=0;
function applyScroll(){
  scrollRaf=0;
  const d=scrollDur;scrollDur=0;
  cellsEl.style.transition=d?`transform ${d}ms var(--ease)`:'none';
  cellsEl.style.transform=`translate(${-offX}px,${-offY}px)`;
  sync(d);
  if(expandedId)place(expandedId,expandRect(),d);
}
function queueScroll(d){
  scrollDur=Math.max(scrollDur,d||0);
  if(!scrollRaf)scrollRaf=requestAnimationFrame(applyScroll);
}
/* Snap the offset to a whole cell. The board is made of cells, so any resting
   position between two of them is a position the board does not have — you end
   up reading half a tile at the top of the screen and half at the bottom. */
function cellStep(){const{uw,uh}=unit();return{x:uw+gap,y:uh+gap};}
function snapOff(){
  const s=cellStep();
  offX=Math.round(offX/s.x)*s.x;
  offY=Math.round(offY/s.y)*s.y;
  clampScroll();
}
/* One gesture, one cell. A trackpad emits dozens of wheel events per flick, so
   without the cooldown a single swipe would fly across the whole extent; with
   it, the board advances a tile at a time and always lands on one. */
const WHEEL_LOCK_MS=150;
let wheelUntil=0;
/* Zoom about the cursor, so the cell under the pointer stays under the pointer —
   zooming about the origin instead makes a canvas feel like it is running away
   from you. Cell size scales with the zoom but the gap does not, so the board
   point under the cursor is recomputed from the live metrics rather than assumed
   to scale linearly. */
function zoomAt(cx,cy,next){
  const p=panelRect();
  const before=unit();
  const bx=(cx-(p.x+PAD)+offX),by=(cy-(p.y+PAD)+offY);
  const colAt=bx/(before.uw+gap),rowAt=by/(before.uh+gap);
  zoom=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,next));
  const after=unit();
  offX=colAt*(after.uw+gap)-(cx-(p.x+PAD));
  offY=rowAt*(after.uh+gap)-(cy-(p.y+PAD));
  clampScroll();
}
addEventListener('wheel',e=>{
  if(!started||expandedId)return;
  // Ctrl+wheel: zoom the canvas, not the page. preventDefault is the whole point
  // and needs a non-passive listener, which is why this one is registered as it is.
  if(e.ctrlKey&&ovf==='canvas'){
    e.preventDefault();
    if(!e.deltaY)return;
    zoomAt(e.clientX,e.clientY,zoom*(e.deltaY>0?0.9:1/0.9));
    renderCells();
    queueScroll(reduce?1:120);
    return;
  }
  if(!scrolls()||!canScroll())return;
  const now=performance.now();
  if(now<wheelUntil)return;
  // Shift+wheel is the horizontal convention everywhere (browsers, editors,
  // design tools), and it is the only way to pan sideways on hardware that has
  // no horizontal wheel — which is most hardware.
  const sideways=(e.shiftKey||!scrollsY())&&scrollsX();
  const raw=sideways?(e.deltaX||e.deltaY):e.deltaY;
  if(!raw)return;
  wheelUntil=now+WHEEL_LOCK_MS;
  const s=cellStep(),dir=raw>0?1:-1;
  if(sideways)offX=(Math.round(offX/s.x)+dir)*s.x;
  else offY=(Math.round(offY/s.y)+dir)*s.y;
  clampScroll();
  queueScroll(reduce?1:260);
},{passive:false});

/* ---- drag the canvas itself ----
   Pointer-down on the board background — not on a tile — grabs the canvas and
   pans it, the way every infinite-canvas tool works. Only in canvas mode: in the
   two carousels there is one axis and a wheel already covers it, and a grabbable
   background there would just be a way to lose your place.
   The listener is on .stage rather than the window so that dragging over the
   control bar or the header does nothing, and it never competes with a tile drag
   because a tile's own pointerdown stops this one from ever seeing the event. */
let pan=null;
stage.addEventListener('pointerdown',e=>{
  if(!started||expandedId||ovf!=='canvas'||e.button!==0)return;
  if(e.target.closest('.card'))return;          // a tile drag, not a canvas pan
  if(!canScroll())return;
  pan={x:e.clientX,y:e.clientY,ox:offX,oy:offY};
  root.classList.add('panning');
  // capture keeps the pan alive if the pointer leaves the stage mid-drag, but it
  // throws for a pointer the element never legitimately owned — and a failed
  // capture must not abort the pan itself
  try{stage.setPointerCapture(e.pointerId);}catch(err){}
});
stage.addEventListener('pointermove',e=>{
  if(!pan)return;
  // follow the hand exactly while it is down — snapping mid-drag would fight the
  // gesture — then settle onto a cell the moment it lets go
  offX=pan.ox-(e.clientX-pan.x);
  offY=pan.oy-(e.clientY-pan.y);
  clampScroll();
  queueScroll(0);
});
for(const ev of ['pointerup','pointercancel'])stage.addEventListener(ev,e=>{
  if(!pan)return;
  pan=null;
  try{stage.releasePointerCapture(e.pointerId);}catch(err){}
  root.classList.remove('panning');
  snapOff();
  queueScroll(reduce?1:280);
});

/* ---- control bar: tabs, then pages within a tab ----
   Nothing is ever dropped for want of width. If a tab's controls do not fit,
   they page; the pager appears only when there is a second page to reach. */
const panesEl=document.getElementById('panes'),pagerEl=document.getElementById('pager'),
      pgNumEl=document.getElementById('pgNum'),pgPrevEl=document.getElementById('pgPrev'),
      pgNextEl=document.getElementById('pgNext');
let ctlPage=0;
/* Is the bar behaving as a sheet? Same query as the CSS, so the two can never
   disagree about which layout is on screen. */
function sheetMode(){return matchMedia('(pointer:coarse),(max-width:760px)').matches;}
/* The pill has to be worth its height while closed, so it reads the two settings
   a visitor is most likely to be checking: what the board does on a drop, and
   how big it is. */
function refreshSheet(){
  const el=document.getElementById('sheetState');
  if(!el)return;
  const m=document.getElementById('modeSel');
  el.textContent=`${m.options[m.selectedIndex].text} · ${cols}×${rows}`;
}
function setSheet(open){
  root.classList.toggle('sheet-open',open);
  document.getElementById('sheetBtn').setAttribute('aria-expanded',open?'true':'false');
}
document.getElementById('sheetBtn').onclick=()=>setSheet(!root.classList.contains('sheet-open'));
// tapping the board dismisses the sheet — but only the board, so that adjusting
// a setting inside the sheet never closes it out from under you
addEventListener('pointerdown',e=>{
  if(!root.classList.contains('sheet-open'))return;
  if(e.target.closest('.controls'))return;
  setSheet(false);
},true);

function layoutPager(){
  const pane=panesEl.querySelector('.pane.on');
  if(!pane)return;
  /* No paging in the sheet. It opens tall enough for every input, so hiding
     controls behind arrows there would be solving a problem that no longer
     exists — and re-hiding them on a resize would strand settings mid-session. */
  if(sheetMode()){
    for(const p of panesEl.querySelectorAll('.pane'))
      for(const c of p.children){c.removeAttribute('data-off');c.removeAttribute('data-first');}
    pagerEl.hidden=true;
    refreshSheet();
    return;
  }
  const ctls=[...pane.children];
  for(const c of ctls){c.removeAttribute('data-off');c.removeAttribute('data-first');}
  const widths=ctls.map(c=>c.getBoundingClientRect().width);
  // everything in the bar that is not the pane, plus the pager's own footprint
  // (reserved as a constant so showing it cannot shrink the budget that decided
  // to show it — that feedback loop oscillates)
  const fixed=[...document.querySelectorAll('.controls .tabs,.controls .ctl.reset')]
    .reduce((s,e)=>s+e.getBoundingClientRect().width,0);
  /* On touch the bar wraps and the pane gets a row to itself, so it is NOT
     competing with the tabs and Reset for width — budgeting as if it were would
     page a control that comfortably fits. Same query as the CSS, so the two can
     never disagree about whether the bar is wrapped. */
  const wrapped=matchMedia('(pointer:coarse),(max-width:760px)').matches;
  const budget=wrapped?Math.max(150,innerWidth-40-96)
                      :Math.max(90,innerWidth-28-fixed-78);
  let per=0,acc=0;
  for(const w of widths){if(acc+w>budget&&per>0)break;acc+=w;per++;}
  per=Math.max(1,per);
  const pages=Math.ceil(ctls.length/per);
  ctlPage=Math.max(0,Math.min(ctlPage,pages-1));
  ctls.forEach((c,i)=>{
    if(i<ctlPage*per||i>=(ctlPage+1)*per)c.setAttribute('data-off','');
  });
  const first=ctls.find(c=>!c.hasAttribute('data-off'));
  if(first)first.setAttribute('data-first','');
  pagerEl.hidden=pages<2;
  pgNumEl.textContent=`${ctlPage+1}/${pages}`;
  pgPrevEl.disabled=ctlPage===0;
  pgNextEl.disabled=ctlPage>=pages-1;
}
function showTab(name){
  ctlPage=0;
  for(const b of document.querySelectorAll('.controls .tab')){
    const on=b.dataset.tab===name;
    b.classList.toggle('on',on);b.setAttribute('aria-selected',on?'true':'false');
  }
  for(const p of panesEl.querySelectorAll('.pane'))p.classList.toggle('on',p.dataset.pane===name);
  layoutPager();
}
for(const b of document.querySelectorAll('.controls .tab'))b.onclick=()=>showTab(b.dataset.tab);
pgPrevEl.onclick=()=>{ctlPage--;layoutPager();};
pgNextEl.onclick=()=>{ctlPage++;layoutPager();};
document.getElementById('themeBtn').onclick=()=>{
  const cur=root.getAttribute('data-theme');
  const sys=matchMedia('(prefers-color-scheme:dark)').matches;
  root.setAttribute('data-theme',(cur?cur:(sys?'dark':'light'))==='dark'?'light':'dark');
};
scrim.addEventListener('click',()=>collapse());
addEventListener('keydown',e=>{
  if(e.key==='Escape'){setSheet(false);collapse();return;}
  if(!started&&!e.metaKey&&!e.ctrlKey&&!e.altKey)start();
});
hint.addEventListener('click',start);
stage.addEventListener('click',e=>{if(!started&&!e.target.closest('a,button'))start();});
/* ---- resize ----
   This used to be `sync(1)` behind a 130ms debounce: nothing moved while you
   dragged the window, then every tile teleported to its new slot simultaneously
   in a single frame. Frame-by-frame that reads as one 33ms jump surrounded by
   dead frames — not a fast animation, the absence of one, which is exactly what
   "choppy, everything at once" describes.
   Three changes. The debounce drops to 60ms so the board starts moving while the
   edge is still travelling rather than waiting for the gesture to end. The tiles
   get a real duration. And they get the diagonal wave, so a re-layout sweeps
   across the board instead of flashing.
   The wave is deliberately tighter here than on the hero handover (10ms per
   diagonal against 38ms): a resize is a response to something you are doing, and
   a response that takes half a second to finish arriving feels laggy no matter
   how pretty the sweep is. */
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if(!started){renderCells();layoutHeroSettled();return;}
  clampScroll();   // a wider viewport can shrink the scrollable range to nothing
  renderCells();
  layoutPager();
  // sync() below deliberately skips the expanded tile, so its new board-sized
  // rect has to be written here or a resize would leave it at the old one
  if(expandedId)place(expandedId,expandRect(),reduce?1:360);
  sync(reduce?1:360,reduce?0:10);
},60);});

root.dataset.phase='hero';
root.classList.add('pristine');   // the headline holds the highlight until you look elsewhere
// the markup ships 12 / 6; the real defaults depend on the screen, so the
// steppers have to be told what they are actually showing before anyone reads them
document.getElementById('colsVal').textContent=cols;
document.getElementById('rowsVal').textContent=rows;
btns();
build();
renderCells();   // the intro floats over a real, empty grid — so it must exist first
requestAnimationFrame(()=>layoutHeroSettled(()=>{
  // settled: raise the curtain, THEN hand the cards back their real durations.
  // Restoring --dur any earlier is what let a provisional position animate.
  root.classList.add('ready');
  requestAnimationFrame(()=>{for(const[,e]of els)e.el.style.removeProperty('--dur');});
}));
btns();
const hold=new URLSearchParams(location.search).has('hold');
if(reduce)start();else if(!hold)setTimeout(()=>{if(!started)start();},2400);
})();
</script>
