<title>Griddle Window Manager</title>
<!-- Without this, a phone lays the page out at ~980px and scales the result down
     to fit the screen. Everything mobile-specific here was therefore dead:
     `max-width:760px` never matched, so the touch sizes and the 4x8 board never
     fired, and the 44px targets that DID apply via `pointer:coarse` were being
     shrunk to about 17 physical px on a 390px phone. One tag; it is the
     precondition for every other mobile fix on this page. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 150'><style>*{fill:%230B0B12}@media(prefers-color-scheme:dark){*{fill:%23F3F3F7}}</style><path d='M8 0H103A8 8 0 0 1 111 8V25A8 8 0 0 1 103 33H37A4 4 0 0 0 33 37V113A4 4 0 0 0 37 117H64A8 8 0 0 1 72 125V142A8 8 0 0 1 64 150H8A8 8 0 0 1 0 142V8A8 8 0 0 1 8 0Z'/><rect x='78' y='78' width='72' height='72' rx='8'/></svg>">
<style>
:root{
  --ground:#FBFBFC; --panel:#F1F1F5; --surface:#FFFFFF; --surface-2:#FAFAFC;
  --surface-hi:#EFEFF6;
  --ink:#0B0B12; --muted:#6E6E7A; --faint:#9C9CA8;
  --line:#E3E3EA; --line-soft:#EDEDF2;
  --accent:#5B5BD6; --accent-soft:rgba(91,91,214,.10); --accent-line:rgba(91,91,214,.45);
  --shadow-lo:0 1px 2px rgba(11,11,18,.05); --shadow-hi:0 18px 44px -12px rgba(11,11,18,.26),0 4px 10px rgba(11,11,18,.08);
  --card-radius:10px;
  --sans:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --text:"Segoe UI Variable Text","Segoe UI",-apple-system,system-ui,sans-serif;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,ui-monospace,monospace;
  /* A plain ease — CSS's own default curve, written out so every transition
     shares one value. Both control-point Y values sit inside 0..1, so a tile
     never travels past the cell it is heading for.
     It replaces easeOutQuint (.22,1,.36,1), which also never overshot but was
     violently front-loaded: 40% of the distance in the first 10% of the time
     and 92% by 40%, then a crawl through the last few percent. That tail is
     what read as a tile arriving and then still creeping.
     --dur is the fallback only. sync() writes an inline --dur per interaction
     (drop 440ms, hero handover 820ms, resize 380ms…), so it is those numbers,
     not this one, that set the pace of anything you can trigger. */
  --ease:cubic-bezier(.25,.1,.25,1); --dur:820ms;
  /* Arrivals decelerate. A tile moving to a slot is always arriving somewhere,
     and a symmetric curve makes ten of them read as a mechanism rather than as
     things coming to rest. easeOutQuad, measured: 27% / 50% / 67% of the
     distance at 10% / 20% / 30% of the time, against 9% / 30% / 51% for plain
     ease and 40% / 67% / 83% for the easeOutQuint this page used to use and
     which read as a snap followed by a crawl. Peak output is exactly 1.0, so
     nothing travels past its slot. */
  --ease-out:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){:root{
  --ground:#09090D; --panel:#121218; --surface:#1A1A22; --surface-2:#15151C;
  --surface-hi:#24242F;
  --ink:#F3F3F7; --muted:#9B9BA9; --faint:#6E6E7E; --line:#282833; --line-soft:#1F1F28;
  --accent:#8C8CF5; --accent-soft:rgba(140,140,245,.14); --accent-line:rgba(140,140,245,.5);
  --shadow-lo:0 1px 2px rgba(0,0,0,.5); --shadow-hi:0 20px 48px -12px rgba(0,0,0,.72),0 4px 12px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --ground:#09090D; --panel:#121218; --surface:#1A1A22; --surface-2:#15151C;
  --surface-hi:#24242F;
  --ink:#F3F3F7; --muted:#9B9BA9; --faint:#6E6E7E; --line:#282833; --line-soft:#1F1F28;
  --accent:#8C8CF5; --accent-soft:rgba(140,140,245,.14); --accent-line:rgba(140,140,245,.5);
  --shadow-lo:0 1px 2px rgba(0,0,0,.5); --shadow-hi:0 20px 48px -12px rgba(0,0,0,.72),0 4px 12px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --ground:#FBFBFC; --panel:#F1F1F5; --surface:#FFFFFF; --surface-2:#FAFAFC;
  --surface-hi:#EFEFF6;
  --ink:#0B0B12; --muted:#6E6E7A; --faint:#9C9CA8; --line:#E3E3EA; --line-soft:#EDEDF2;
  --accent:#5B5BD6; --accent-soft:rgba(91,91,214,.10); --accent-line:rgba(91,91,214,.45);
  --shadow-lo:0 1px 2px rgba(11,11,18,.05); --shadow-hi:0 18px 44px -12px rgba(11,11,18,.26),0 4px 10px rgba(11,11,18,.08);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--text);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.topbar{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;
  justify-content:space-between;padding:0 clamp(14px,3vw,34px);z-index:60;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:700;font-size:14.5px;letter-spacing:-.02em}
/* The G is built out of grid cells: 4x4, cell 33, gap 6, on a 150 master.
   The counter is solid here because below 32px an outlined one would land
   at a sub-pixel stroke. Source of truth: apps/desktop/app-icon.svg. */
.mark{width:18px;height:18px;flex:none;color:var(--ink);display:block}
.navlinks{display:flex;align-items:center;gap:16px}
.navlink{font-size:13px;color:var(--muted);text-decoration:none;font-weight:500}
.navlink:hover{color:var(--ink)}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--muted);cursor:pointer;font-size:12px;padding:0}
.iconbtn:hover{color:var(--ink);border-color:var(--accent-line)}

/* absolute, NOT fixed. position:fixed creates a stacking context, which trapped
   every card inside it — so .card.expanded's z-index:90 was competing with its
   siblings rather than with .scrim's 80, and the scrim painted over the expanded
   card no matter how high its z-index went. html/body are height:100% with
   overflow:hidden, so absolute inset:0 lands in exactly the same place while
   leaving the cards in the root stacking context where the z-index scale means
   what it says. */
.stage{position:absolute;inset:0;overflow:hidden}
/* The board clip (set inline by renderCells) makes .stage a STACKING CONTEXT,
   which re-created the exact bug the note above .stage's position warns about:
   .card.expanded's z-index:90 stops competing with .scrim's 80 and starts
   competing with its own siblings, so an opened tile paints UNDER the scrim and
   comes back blurred.
   While a tile is open the clip is simply dropped. It has nothing to do then —
   the open tile covers the whole board and the scrim covers everything else, so
   there is nothing outside the board left to clip. !important because the clip
   is an inline style and would otherwise win. */
html.reading .stage{clip-path:none !important}
/* Canvas mode makes the empty board grabbable, the way every infinite-canvas
   tool does. Tiles keep their own cursors — you grab the canvas, not a window. */
html.canvasmode .stage{cursor:grab}
html.canvasmode .card{cursor:auto}
html.panning .stage,html.panning .card{cursor:grabbing}

/* THE CURTAIN. Laying the hero out takes two passes — a provisional box, then
   the real one measured from rendered text — and both used to be on screen. The
   page painted ten unpositioned cards stacked at the origin at full opacity for
   ~125ms, then snapped the description into place, then threw it back to its
   provisional box and crawled it 400px down THROUGH the headline over a second.
   Measuring under opacity:0 keeps every measurement valid (unlike display:none)
   while showing none of it. Nothing is revealed until the layout has settled. */
html:not(.ready) .stage,html:not(.ready) .gridwrap,html:not(.ready) .hint{opacity:0}
.stage{transition:opacity 520ms ease}

/* ============================================================
   ONE component per card. Content is authored once, for the GRID.
   The hero is the same nodes with different geometry and type
   scale — never a second copy — so nothing cross-fades or ghosts.
   ============================================================ */
.card{position:absolute;left:0;top:0;border-radius:var(--card-radius);overflow:hidden;
  display:flex;flex-direction:column;background:transparent;
  border:1px solid transparent;will-change:transform,width,height;
  transition:transform var(--dur) var(--ease-out) var(--delay,0ms),
    width var(--dur) var(--ease-out) var(--delay,0ms),
    height var(--dur) var(--ease-out) var(--delay,0ms),
    opacity 420ms ease var(--delay,0ms),
    border-color 620ms ease,box-shadow 620ms ease}
.card.parked{opacity:0;pointer-events:none}

/* Tiles are ALWAYS fully opaque. Highlight is a colour change, not a fade:
   a translucent tile reads as unloaded or disabled, and on a busy board ten of
   them at 89% made the whole grid look washed out. The one you are pointing at
   lifts to --surface-hi instead.
   The surface is still its own layer rather than the card's background-color,
   because the card's content sits above it and a background transition on the
   card itself repaints every child on every frame of the ramp. */
.card::before{content:"";position:absolute;inset:0;z-index:-1;
  background:var(--surface);pointer-events:none;
  transition:background 220ms ease}
.card:hover::before,.card.dragging::before,.card.expanded::before{background:var(--surface-hi)}

/* hero phase: chrome dissolves, card becomes bare type on the page */
[data-phase="hero"] .card.inhero{border-color:transparent;box-shadow:none}
[data-phase="hero"] .card.inhero::before{background:transparent}
[data-phase="grid"] .card{border-color:var(--line);box-shadow:var(--shadow-lo)}

/* ...except the headline, which IS the intro window. It keeps its chrome while
   floating over an empty grid, then minimises into its own tile. The three other
   hero elements ride inside it and fly out to their own seats. */
[data-phase="hero"] .card.inhero[data-id="headline"]{border-color:var(--line);box-shadow:var(--shadow-hi)}
[data-phase="hero"] .card.inhero[data-id="headline"]::before{background:var(--surface-hi)}
/* and it stays highlighted once it becomes a tile, until you touch another one —
   so there is always exactly one tile showing you what "highlighted" looks like,
   and the page starts by pointing at the thing worth reading first. `pristine`
   is dropped the moment any other tile is hovered, dragged or opened. */
html.pristine[data-phase="grid"] .card[data-id="headline"]::before{background:var(--surface-hi)}

.titlebar{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 11px;
  border-bottom:1px solid transparent;opacity:0;transition:opacity 420ms ease,border-color 620ms ease;
  cursor:grab;user-select:none;touch-action:none}
/* The whole card swallows touch gestures, because the drag zone is now a third
   of it rather than the titlebar alone — without this the browser claims the
   drag as a scroll and the tile never moves on a phone. Safe here: the page
   itself never scrolls (html/body are overflow:hidden). */
.card{touch-action:none}
/* the grab cursor follows the real zone: the top third, not the strip */
[data-phase="grid"] .card{cursor:grab}
[data-phase="grid"] .card .content,[data-phase="grid"] .card .detail{cursor:default}
html.panning .card,.card.dragging{cursor:grabbing}
[data-phase="grid"] .titlebar{opacity:1;border-bottom-color:var(--line-soft)}
[data-phase="hero"] .card.inhero .titlebar{height:0;overflow:hidden}
[data-phase="hero"] .card.inhero[data-id="headline"] .titlebar{height:30px;overflow:visible;
  opacity:1;border-bottom-color:var(--line-soft)}
.card.dragging .titlebar{cursor:grabbing}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}
.tbname{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.closebtn{margin-left:auto;width:21px;height:21px;border:0;background:transparent;color:var(--faint);
  cursor:pointer;font-size:14px;line-height:1;padding:0;display:none;place-items:center;border-radius:5px}
.card.expanded .closebtn{display:grid}
.closebtn:hover{color:var(--ink);background:var(--line-soft)}

/* padding tracks viewport height so single-row tiles never crop their text */
/* A QUERY CONTAINER. Tile content that wants to scale should scale with its
   TILE, not with the viewport — a 3x1 tile and a 8x6 tile on the same screen
   have the same vw and wildly different room. Safe to contain: the card is
   explicitly sized in px and .content is flex:1 of it, so its size never came
   from its children in the first place. */
.content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;
  gap:clamp(4px,.8vh,8px);padding:var(--padY,16px) var(--padX,20px);
  overflow:hidden;transition:padding var(--dur) var(--ease-out),gap var(--dur) var(--ease-out);
  container:tile / size}
[data-phase="hero"] .card.inhero .content{padding:0;align-items:center;text-align:center;gap:0}
/* The intro group is centred as a whole, not hung off a centred headline, so the
   space above the eyebrow and below the description stays balanced. JS measures
   the real text and sets --hero-top. */
[data-phase="hero"] .card.inhero[data-id="headline"] .content{
  justify-content:flex-start;padding:var(--hero-top,0px) clamp(16px,3vw,48px) 0}

/* Type scales between phases on the SAME nodes — no duplicate text. */
.headline{font-family:var(--sans);font-weight:800;letter-spacing:-.042em;line-height:1.0;
  margin:0;text-wrap:balance;
  /* letter-spacing tightens between phases too — left untransitioned it snapped
     the whole line's width in one frame while the box was still moving */
  transition:font-size var(--dur) var(--ease-out),line-height var(--dur) var(--ease-out),
    letter-spacing var(--dur) var(--ease-out)}
/* vh term keeps the intro type from outgrowing the window on short viewports */
[data-phase="hero"] .headline{font-size:clamp(30px,min(5.6vw,11.5vh),76px);line-height:.95;letter-spacing:-.048em}
[data-phase="grid"] .headline{font-size:clamp(15px,6.6cqi,38px);line-height:1.08}
.headline .br{display:block}

.dek{color:var(--muted);margin:0;text-wrap:pretty;overflow:hidden;
  transition:font-size var(--dur) var(--ease)}
[data-phase="hero"] .dek{font-size:clamp(13.5px,1.3vw,17px);line-height:1.5;max-width:32em}
[data-phase="grid"] .dek{font-size:clamp(11px,4.4cqi,19px);line-height:1.5}

.eyebrow{font-family:var(--mono);color:var(--accent);text-transform:uppercase;font-weight:600;
  white-space:nowrap;transition:font-size var(--dur) var(--ease),letter-spacing var(--dur) var(--ease)}
[data-phase="hero"] .eyebrow{font-size:clamp(9.5px,.78vw,11px);letter-spacing:.2em}
[data-phase="grid"] .eyebrow{font-size:clamp(8.5px,.68vw,10px);letter-spacing:.13em}

/* The download tile drops to the page's backmost colour instead of the card
   surface every other tile uses. The CTA inside it is painted in --ink, which is
   the exact inverse of --ground in both themes — so the button lands on the
   widest contrast step the palette has, and the one tile that matters most is
   the one the eye reaches first. */
[data-phase="grid"] .card[data-id="cta"]::before{background:var(--ground)}
.card[data-id="cta"] .meta{color:var(--muted)}

.cta{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
  background:var(--ink);color:var(--ground);font-weight:600;border:0;cursor:pointer;
  text-decoration:none;white-space:nowrap;align-self:center;
  transition:height var(--dur) var(--ease),padding var(--dur) var(--ease),
    font-size var(--dur) var(--ease),filter 160ms ease}
[data-phase="hero"] .cta{height:50px;padding:0 24px;font-size:14.5px}
[data-phase="grid"] .cta{height:34px;padding:0 14px;font-size:12.5px}
/* The detail layer covers the card face, so expanding the Download tile would
   otherwise hide the one button on this page that matters. The popout carries
   its own copy of the button — larger, since it now has a whole board to sit on
   — and it outranks the grid-phase sizing above. */
[data-phase="grid"] .detail .cta{align-self:flex-start;height:clamp(40px,3.4vw,54px);
  padding:0 clamp(18px,1.9vw,32px);font-size:clamp(13px,1.12vw,17.5px)}
.dbuy{display:flex;flex-direction:column;gap:clamp(6px,.9vh,10px);align-items:flex-start}
.dbuy .meta{text-align:left;font-size:clamp(9.5px,.8vw,13px)}
.cta:hover{filter:brightness(1.15)}
.meta{font-family:var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:center;transition:font-size var(--dur) var(--ease)}
[data-phase="hero"] .meta{font-size:11px}
[data-phase="grid"] .meta{font-size:9.5px}

.applabel{font-size:clamp(10px,4.6cqi,17px);color:var(--muted);line-height:1.45;overflow:hidden}
.applabel b{color:var(--ink);font-weight:650}

/* ---- in-tile content ----
   Every tile says something true about the app before it is clicked. Empty
   tiles made the board read as a mockup of a product rather than the product;
   these are the actual feature set, at a size that survives a 27" monitor. */

/* the headline tile keeps its hero type, and gains a second line once it is a
   tile — the claim needs a supporting sentence at tile scale, and the hero
   cannot afford one */
.subhead{color:var(--muted);margin:clamp(10px,1.4vh,20px) 0 0;line-height:1.5;text-wrap:pretty;
  font-size:clamp(10px,3.5cqi,17px);max-width:38em}
/* content that only makes sense once the card is a tile. The hero is one
   sentence and a headline by design; these would crowd it. */
/* Content that only makes sense once the card is a tile. It used to be
   display:none in the hero, which cannot be interpolated — so at the instant the
   phase flipped, whole paragraphs appeared at full opacity in a box that was
   still travelling. That pop is most of why the handover read as "the text
   disappears and reappears".
   Now it is present in both phases and REVEALED: it holds no height in the hero
   (so the intro composition is unchanged) and expands, fades and rises into
   place. The delay lets the card land first — content that arrives before its
   container has stopped moving reads as two separate events. */
.gridonly{transition:opacity 340ms var(--ease-out) 380ms,
  transform 420ms var(--ease-out) 380ms,
  max-height 500ms var(--ease-out) 300ms,
  margin 420ms var(--ease-out) 300ms}
[data-phase="hero"] .gridonly{opacity:0;transform:translateY(8px);
  max-height:0;margin-top:0;margin-bottom:0;overflow:hidden;pointer-events:none;
  transition:opacity 160ms ease,transform 160ms ease,max-height 200ms ease,margin 200ms ease}
[data-phase="grid"] .gridonly{opacity:1;transform:none;max-height:60vh}

/* key/value feature rows — the label is the term, the value is what it does */
.feat{display:flex;flex-direction:column;gap:clamp(4px,2.6cqb,18px);overflow:hidden}
.frow{display:flex;gap:9px;align-items:baseline;line-height:1.4}
.fkey{flex:none;min-width:clamp(46px,17cqi,80px);font-family:var(--mono);font-size:clamp(8px,2.7cqi,12.5px);
  color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.fval{font-size:clamp(10px,3.7cqi,17px);color:var(--muted);text-wrap:pretty}
.fval b{color:var(--ink);font-weight:600}

/* template thumbnails: real built-ins, drawn as the layouts they are */
/* Template thumbnails are BUTTONS in both places — the tile face and the popout
   — and both render from the same TEMPLATES data, so a thumbnail can never show
   a layout different from the one it applies. */
/* CAPPED, not fluid. A template thumbnail carries no more information at 700px
   than at 100px, so letting it grow with its tile is pure waste — and when a
   template hands the Templates tile a 6x4 slot, "grow with the tile" meant four
   700px diagrams bursting out of a card that could not show them. The gallery
   gets a ceiling and the columns reflow inside it; auto-fit means one column on
   a narrow tile and four on a wide one, with the thumbnails the same size in
   both. min-height:0 lets it be clipped rather than forcing the card taller. */
/* Sized against the TILE, not the viewport (cqi = 1% of the container's inline
   size, cqb of its block size). A fixed max-width was the previous fix for
   thumbnails ballooning on a big tile, and it overcorrected: on a large tile the
   gallery sat marooned at 430px in the middle of acres of space. Container units
   scale it with the tile in both directions instead — wide tile, wide
   thumbnails; short tile, capped height so it cannot overflow. */
/* THE GALLERY DIVIDES THE TILE. Four templates, four sections, filling the
   content box rather than sitting in the middle of it as fixed thumbnails — so
   each option is a target the size of a quarter of the tile, not a 96px chip.
   The split follows the tile's SHAPE, because four columns inside a tall narrow
   tile gives four slivers and four rows inside a wide one gives four ribbons:

     wide and short   →  four columns
     roughly square   →  quadrants
     tall and narrow  →  four rows

   Aspect is asked of the container, so it is the tile's real proportion that
   decides, not the viewport's. */
.tgal{display:grid;gap:clamp(5px,1.8cqi,14px);width:100%;flex:1 1 auto;min-height:0;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr))}
@container tile (min-aspect-ratio:2/1){
  .tgal{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
}
@container tile (max-aspect-ratio:1/2){
  .tgal{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(4,minmax(0,1fr))}
}
.tmini,.dtpl{display:flex;flex-direction:column;gap:5px;align-items:center;
  justify-content:center;background:none;border:1px solid var(--line);border-radius:7px;
  padding:5px;cursor:pointer;font:inherit;color:inherit;text-align:center;
  min-width:0;min-height:0;overflow:hidden;
  transition:border-color 160ms ease,background 160ms ease}
/* the quadrant IS the hover target, so the whole section responds — surface,
   border, and the slots inside the thumbnail all lift together */
.tmini:hover,.dtpl:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.tmini:hover .dtile{fill:var(--accent-soft);stroke:var(--accent)}
.tmini:hover span{color:var(--ink)}
.tmini:focus-visible,.dtpl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dtpl svg{width:100%;height:auto;display:block}
/* The thumbnail fills its quadrant and letterboxes — width and height both 100%
   with the viewBox's default preserveAspectRatio doing the fitting, so a wide
   section and a tall one each get the largest diagram that fits without ever
   distorting the layout it is depicting. */
.tmini svg{width:100%;height:100%;min-height:0;display:block}
/* Each quadrant is its own container, so it can decide for itself whether it has
   room for a caption. A section too small for the name keeps the diagram — the
   shape is the information, the word is the label for it. */
.tmini{container:quad / size}
.tmini span{font-size:clamp(8px,3.2cqi,15px);color:var(--muted);font-family:var(--mono);
  letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;
  transition:color 160ms ease}
@container quad (max-height:64px){ .tmini span{display:none} }
@container quad (max-width:70px){ .tmini span{display:none} }
.dtpl span{font-size:clamp(9.5px,.8vw,13px);color:var(--ink);font-family:var(--mono);
  letter-spacing:.03em;font-weight:600}
.dtpl em{font-style:normal;font-size:clamp(9px,.75vw,12px);color:var(--faint);line-height:1.4;
  text-wrap:pretty}
/* the dimensions it will set. Stated up front, because clicking one of these
   changes the grid under you and that should never be a surprise. */
.dtpl i{font-style:normal;font-family:var(--mono);font-size:clamp(8.5px,.7vw,11px);
  color:var(--accent);letter-spacing:.06em;margin-top:1px}
.tmini-unused{aspect-ratio:16/11;display:grid;gap:2px;padding:2px;border:1px solid var(--line);
  border-radius:4px;background:var(--surface-2)}
.tmini i{display:block;border-radius:2px;background:var(--accent-soft);border:1px solid var(--accent-line)}
.tnew{border-style:dashed;background:none;place-items:center;color:var(--faint);
  font-size:14px;line-height:1;font-family:var(--mono)}
.tcap{font-size:clamp(9.5px,3cqi,15px);color:var(--muted);line-height:1.45;margin:clamp(5px,1.6cqb,12px) 0 0;text-wrap:pretty}

/* a compact stat strip for the short tiles */
.kv{display:flex;flex-wrap:wrap;gap:clamp(3px,1.4cqb,8px) clamp(10px,4cqi,26px);
  font-size:clamp(9.5px,3.4cqi,15px);color:var(--muted);line-height:1.5;margin-top:clamp(6px,2.4cqb,18px)}
.kv b{color:var(--ink);font-weight:600}

/* detail layer — genuinely different content, so it is an overlay that
   fades in over the same card rather than replacing anything.
   The expanded card is now the size of the whole board, so this layer has room
   to be a document rather than a tooltip: a title, one lead sentence, structured
   key/value rows in the same language the tile faces use, and a figure. Every
   size is a clamp against the viewport, so the same markup is a full-bleed sheet
   on a phone and a two-column spread on a 27". */
.detail{position:absolute;inset:0;background:var(--surface);
  padding:clamp(18px,2.4vw,46px) clamp(20px,2.8vw,54px);
  display:flex;flex-direction:column;gap:clamp(12px,1.7vh,24px);
  overflow-y:auto;opacity:0;pointer-events:none;
  transition:opacity 280ms ease}
.card.expanded .detail{opacity:1;pointer-events:auto}
.card.expanded{z-index:90;box-shadow:var(--shadow-hi)}
/* A card that is MID-FLIGHT and must not be painted over.
   Cards stack in DOM order, and the headline is the first one built — so it sits
   at the bottom of the pile and every other tile crosses over the top of it
   during the hero handover. The same thing bites on close: dropping .expanded
   takes z-index:90 away in one frame, while the tile still has 460ms of
   shrinking to do, so it finishes its journey underneath the board.
   85 is chosen to clear the scrim at 80 — a closing tile has to stay above the
   backdrop-filter it was opened over — while staying under .expanded's 90. */
.card.lifted{z-index:85}
.card.expanded .titlebar{cursor:default}
.dtitle{font-family:var(--sans);font-size:clamp(21px,2.15vw,36px);font-weight:750;
  letter-spacing:-.025em;margin:0;line-height:1.12;text-wrap:balance}
/* the one sentence that has to land: --ink, not --muted, and set larger than
   the rows beneath it so the eye starts in the right place */
.dlead{font-size:clamp(14px,1.25vw,21px);line-height:1.5;color:var(--ink);
  margin:0;max-width:44em;text-wrap:pretty;font-weight:500}
.dbody{font-size:clamp(13px,1.05vw,17px);line-height:1.6;color:var(--muted);margin:0;
  max-width:52em;text-wrap:pretty}
.dbody b{color:var(--ink);font-weight:600}
/* a second heading inside one popout — the tile covers two settings now, and
   running them together as undifferentiated paragraphs made both harder to find */
.dsub{font-family:var(--sans);font-size:clamp(14px,1.25vw,21px);font-weight:700;
  letter-spacing:-.015em;color:var(--ink);margin:clamp(6px,1vh,14px) 0 0;line-height:1.25}

/* text beside figure. One column until there is genuinely room for two — a
   cramped 2-up is worse than a stack, and the figures are the first thing to
   suffer from it. */
.dsplit{display:grid;grid-template-columns:minmax(0,1fr);
  gap:clamp(16px,2vw,38px);align-items:start}
@media (min-width:1000px){.dsplit{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.dsplit.wide{grid-template-columns:minmax(0,1fr)}

/* the tile faces speak in key/value rows; the popout speaks the same language,
   just louder. Rules between rows, not boxes around them — this is a spec sheet,
   not a set of cards inside a card. */
.drows{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:clamp(78px,7vw,124px) minmax(0,1fr);
  gap:clamp(10px,1.1vw,18px);align-items:baseline;
  padding:clamp(9px,1.3vh,16px) 0;border-top:1px solid var(--line-soft)}
.drow:first-child{border-top:0;padding-top:0}
.dkey{font-family:var(--mono);font-size:clamp(9px,.76vw,13px);color:var(--accent);
  text-transform:uppercase;letter-spacing:.08em;font-weight:600;line-height:1.5}
.dval{font-size:clamp(12.5px,1.02vw,17px);line-height:1.55;color:var(--muted);text-wrap:pretty}
.dval b{color:var(--ink);font-weight:600}

/* figures sit on --surface-2 so a diagram drawn in --line/--accent reads as a
   specimen under glass rather than as more page furniture */
.dfig{margin:0;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  padding:clamp(11px,1.3vw,20px);display:flex;flex-direction:column;gap:clamp(8px,1vh,14px)}
.dfig svg,.dfig img{width:100%;height:auto;display:block;border-radius:6px}
.dfig img{border:1px solid var(--line)}
/* Diagram parts are classed rather than filled inline: presentation attributes
   and var() are a browser-support coin-toss, and a stylesheet gets both themes
   from one declaration anyway. */
.dfig .dcell{fill:none;stroke:var(--line);stroke-dasharray:2 3}
/* Unscoped on purpose. tplSvg draws the template thumbnails for BOTH the popout
   figure and the tile-face gallery, but these rules used to sit under .dfig — so
   on the tile itself every slot fell back to the default black fill and the
   thumbnails rendered as solid blocks. */
.dtile{fill:var(--surface);stroke:var(--line)}
.dtile.lit{fill:var(--accent-soft);stroke:var(--accent-line)}
.dtile.ghost{fill:none;stroke:var(--faint);stroke-dasharray:3 2}
.dfig .ddead{fill:var(--line-soft);stroke:var(--line)}
.dfig text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.dfig text.lit{fill:var(--accent)}
.dfig text.cap{fill:var(--faint);font-size:9px;letter-spacing:.06em}
.dfig .darrow{stroke:var(--faint);fill:none;stroke-width:1}
.dcap{font-size:clamp(10px,.82vw,13.5px);line-height:1.5;color:var(--faint);
  margin:0;text-wrap:pretty}
.dcap b{color:var(--muted);font-weight:600}

/* the three-mode comparison: label, board, consequence — stacked, so the four
   boards line up in a column and the differences read down the page */
.dmodes{display:flex;flex-direction:column;gap:clamp(9px,1.3vh,16px)}
.dmode{display:grid;grid-template-columns:clamp(60px,5.4vw,92px) minmax(80px,1.5fr) minmax(0,1.6fr);
  gap:clamp(8px,1vw,16px);align-items:center}
@media (max-width:640px){.dmode{grid-template-columns:1fr;gap:5px}}
.dmlabel{font-family:var(--mono);font-size:clamp(8.5px,.72vw,12px);color:var(--ink);
  text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.dmnote{font-size:clamp(10px,.85vw,14px);line-height:1.45;color:var(--muted);text-wrap:pretty}

/* template gallery, at a size where the layout each one describes is readable */
/* Same ceiling reasoning as .tgal. The popout is the whole board now, so an
   uncapped auto-fit would stretch four thumbnails across a 2000px screen.
   (The stale .dtpl / .dtpl span rules that used to sit here were overriding the
   real ones further up — the name rendered muted and small instead of solid.) */
.dtpls{display:grid;gap:clamp(8px,1vw,16px);width:100%;max-width:min(100%,900px);
  grid-template-columns:repeat(auto-fit,minmax(clamp(112px,13vw,215px),1fr))}

/* overflow:hidden is what makes the carousel a carousel — cells (and, being
   clipped by .stage, tiles) past the visible page are drawn but not shown until
   you scroll to them */
.gridwrap{position:absolute;border-radius:13px;background:var(--panel);opacity:0;overflow:hidden;
  transition:opacity 620ms ease;pointer-events:none}
[data-phase="grid"] .gridwrap{opacity:1}
/* the intro floats over the empty grid rather than a blank page — it has to be
   legible enough to read as a grid, or the morph has nothing to land in */
[data-phase="hero"] .gridwrap{opacity:.85}
.cell{position:absolute;border-radius:5px;border:1px dashed var(--line);opacity:.5}
/* in the grid phase every cell is covered by a card, so --line is enough contrast.
   In the intro the empty grid is the point, so it gets a brighter dash. */
[data-phase="hero"] .cell{border-color:var(--faint);opacity:.45}

/* Per-tile resize: Griddle's own south-east handle, the same one the desktop app
   exposes (resizeHandles defaults to ["se"]). Dragging it calls grid.resizeTile(),
   which quantises to whole cells and pushes neighbours out of the way — so the
   tile can only ever be a whole number of cells wide and tall. It lives on the
   card, not in the gutter, because it resizes a window rather than a column. */
.rhandle{position:absolute;right:0;bottom:0;width:22px;height:22px;z-index:2;
  border:0;padding:0;background:transparent;cursor:nwse-resize;touch-action:none;
  opacity:0;transition:opacity 260ms ease}
[data-phase="grid"].tools-on .rhandle{opacity:1}
.card.expanded .rhandle,.card.parked .rhandle{display:none}
/* a corner bracket, not an icon — it reads as "grab this corner" at 9px.
   Drawn in --line, the same weight as the card's own border: present on ten
   tiles at once, anything brighter reads as decoration and pulls the eye off
   the content. It earns contrast only under the cursor. */
.rhandle::after{content:"";position:absolute;right:4px;bottom:4px;width:9px;height:9px;
  border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);
  border-bottom-right-radius:3px;transition:border-color 140ms ease}
.card:hover .rhandle::after{border-color:var(--faint)}
.rhandle:hover::after,.rhandle:focus-visible::after,.rhandle.grabbing::after{border-color:var(--accent)}
.rhandle:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
/* Drop preview. It must paint ABOVE the tiles, not on the grid backdrop: the
   board is fully packed with opaque cards, so a highlight underneath them is
   invisible in exactly the moment it is needed. This is what the app itself
   does — a translucent overlay over the real windows, showing the cells you are
   about to claim. Cells are drawn individually so you can count them, which is
   the whole point of a grid.
   Above the DRAGGED card too (z-index 55 vs its 50), not just the static ones:
   the card follows the cursor and the snap target is the cell under it, so the
   two almost always coincide — draw the preview underneath and the card hides
   the very thing it is previewing. The wash is ~12% alpha, so the card still
   reads through it. */
.preview{position:absolute;inset:0;pointer-events:none;z-index:55;opacity:0;
  transition:opacity 120ms ease}
.preview.on{opacity:1}
.pcell{position:absolute;border-radius:5px;background:var(--accent-soft);
  border:1px solid var(--accent-line)}
.pzone{position:absolute;border-radius:7px;border:2px solid var(--accent);
  box-shadow:0 0 0 1px var(--ground)}

.controls{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(14px);
  display:flex;align-items:center;gap:3px;padding:6px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-hi);z-index:70;
  opacity:0;pointer-events:none;transition:opacity 420ms ease,transform 420ms var(--ease)}
.controls.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.ctl{display:flex;align-items:center;gap:6px;padding:3px 7px}
.ctl+.ctl{border-left:1px solid var(--line-soft)}
.ctl label{font-size:9.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.09em;text-transform:uppercase}

/* ---- tabs + pager ----
   Two groups, one visible at a time; and if a group is still too wide for the
   viewport, it pages rather than dropping anything. Reset sits OUTSIDE both, so
   the escape hatch is never a tab away — a demo that can strand you in a state
   you cannot undo is worse than one with a crowded bar. */
/* The tabs govern everything to their right, so they read as a section rather
   than as the first control in a row of equals: their own well, a wider gutter
   than the between-control dividers, and a full-height rule in --line (the
   dividers between controls are --line-soft). Without it the eye groups
   "Behaviour" with "Columns" and the tabs look like just another setting. */
.tabs{display:flex;gap:2px;padding:2px;background:var(--surface-2);border-radius:8px;flex:none;
  position:relative;margin-right:11px}
.tabs::after{content:"";position:absolute;right:-11px;top:-4px;bottom:-4px;width:1px;
  background:var(--line)}
.tab{font-family:var(--text);font-size:11px;font-weight:600;color:var(--faint);
  background:none;border:0;border-radius:6px;padding:4px 9px;cursor:pointer;line-height:1.3;
  transition:color 160ms ease,background 160ms ease}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow-lo)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.panes{display:flex;align-items:center;min-width:0}
.pane{display:none;align-items:center;gap:3px}
.pane.on{display:flex}
/* a control the pager has scrolled past is hidden, not removed: removing it
   would let the bar's width jump around as you page */
.pane .ctl[data-off]{display:none}
.pane .ctl[data-first]{border-left:0}
.pager{display:flex;align-items:center;gap:2px;flex:none;padding-left:3px;
  border-left:1px solid var(--line-soft)}
.pager[hidden]{display:none}
.pager button{width:20px;height:22px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--muted);border-radius:6px;cursor:pointer;font-size:12px;line-height:1;padding:0;
  display:grid;place-items:center}
.pager button:hover:not(:disabled){color:var(--ink);border-color:var(--accent-line)}
.pager button:disabled{opacity:.34;cursor:default}
.pgnum{font-family:var(--mono);font-size:10px;color:var(--faint);min-width:22px;text-align:center;
  font-variant-numeric:tabular-nums}
.ctl.reset{border-left:1px solid var(--line-soft)}
/* Overflow is meaningless under Overlap — tiles never contest space, so nothing
   can ever fail to fit. Say so by disabling it rather than leaving a live-looking
   control that does nothing. */
.ctl.inert{opacity:.4}
.ctl.inert select{pointer-events:none}
.step{display:flex;align-items:center;gap:1px}
.step button{width:22px;height:22px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--muted);border-radius:6px;cursor:pointer;font-size:13px;line-height:1;padding:0;display:grid;place-items:center}
.step button:hover:not(:disabled){color:var(--ink);border-color:var(--accent-line)}
.step button:disabled{opacity:.34;cursor:default}
.step .val{min-width:20px;text-align:center;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
select.mode{font-family:var(--text);font-size:12px;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:3px 6px;cursor:pointer}
/* Reset is disabled until something has actually diverged from the seeded page,
   so it reads as "there is nothing to undo here" rather than as a live control
   that happens to do nothing. It is always present, never conditionally shown —
   a control that appears and disappears would resize the bar, which is the very
   thing the toast was moved out of the bar to avoid. */
.resetbtn{font-family:var(--text);font-size:12px;font-weight:600;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  padding:4px 11px;cursor:pointer;line-height:1.4;
  transition:opacity 200ms ease,border-color 160ms ease,color 160ms ease}
.resetbtn:hover:not(:disabled){border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.resetbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.resetbtn:disabled{opacity:.34;cursor:default}
/* Status lives ABOVE the control bar, never inside it. As a child of .controls
   this animated its own max-width, so every message widened the bar and shifted
   every button under the user's cursor — then shifted them back on the way out.
   Fixed-position and centred on its own axis, it cannot move anything. */
.toast{position:fixed;left:50%;bottom:70px;z-index:75;
  display:flex;align-items:center;gap:10px;padding:7px 8px 7px 13px;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  box-shadow:var(--shadow-hi);white-space:nowrap;
  opacity:0;pointer-events:none;transform:translateX(-50%) translateY(6px);
  transition:opacity 200ms ease,transform 200ms var(--ease)}
.toast.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
/* replayed on every message so a REPLACED toast still reads as a new event —
   without it, rapid actions look like one stuck toast */
.toast.bump{animation:tbump 240ms var(--ease)}
@keyframes tbump{0%{transform:translateX(-50%) translateY(4px)}100%{transform:translateX(-50%) translateY(0)}}
.tmsg{font-size:11px;color:var(--accent);font-family:var(--mono)}
.tundo{display:none;font-family:var(--text);font-size:11px;font-weight:600;
  color:var(--ink);background:var(--surface-2);border:1px solid var(--line);
  border-radius:6px;padding:3px 9px;cursor:pointer;line-height:1.4}
.toast.undoable .tundo{display:block}
.tundo:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.tundo:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.scrim{position:fixed;inset:0;background:rgba(11,11,18,.34);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity 280ms ease;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}

.hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-family:var(--mono);
  font-size:10.5px;color:var(--faint);letter-spacing:.06em;z-index:65;background:none;border:0;
  cursor:pointer;padding:8px 12px;transition:opacity 300ms ease}
.hint.gone{opacity:0;pointer-events:none}

/* No control is ever dropped for want of width any more. Two rules used to hide
   Gap below 1100px and Corners below 1280px outright — not collapse them, hide
   them — so on a laptop those settings did not exist. Tabs plus the pager cover
   the same ground without ever making a setting unreachable. */
/* TOUCH. A 22px corner grip is a mouse target, not a finger one — the guidance
   floor is 44px, and this used to give up entirely and hide the handle below
   900px, so on every phone and most tablets a tile simply could not be resized.
   Instead: grow the target on coarse pointers, and grow the mark with it.
   min(44px, 38%) is the compromise that keeps it honest on small tiles — a fixed
   44px handle on a 90px tile is half the tile, and you would hit resize every
   time you meant to drag. */
@media (pointer:coarse){
  .rhandle{width:min(44px,38%);height:min(44px,38%)}
  .rhandle::after{right:7px;bottom:7px;width:15px;height:15px;border-width:2px}
  /* there is no hover on touch, so the affordance has to be visible at rest or
     it may as well not exist */
  [data-phase="grid"].tools-on .rhandle::after{border-color:var(--faint)}
  .rhandle.grabbing::after{border-color:var(--accent);border-width:2.5px}
}

/* ---- progressive disclosure, by TILE ----
   A tile never truncates: when it runs out of room it drops the least important
   thing it is carrying rather than clipping the most important one. These are
   container queries, so they fire on the TILE's own size — the same card is
   verbose at 5x3 and terse at 3x1 on one screen, which a media query cannot
   express because both have the same viewport.
   Ordered least-important-first, so a shrinking tile sheds supporting detail,
   then secondary rows, and gives up the headline last. */
@container tile (max-height:130px){
  .subhead,.tcap{display:none}
}
@container tile (max-height:104px){
  .kv{display:none}
}
/* Key/value rows used to shed from the bottom up here. They no longer do: these
   rows are a list of OPTIONS, and showing two of four does not read as "no room
   for the rest", it reads as "there are two". The description gives way instead
   — see the three-step ladder further down, which owns this behaviour now. */
/* narrow tiles cannot hold a mono key beside its value, so stack the pair */
@container tile (max-width:190px){
  .frow{flex-direction:column;gap:1px}
  .fkey{min-width:0}
}
/* Below this the gallery is unreadable, so the tile says what it is for instead
   of showing thumbnails nobody can read — same rule as the option lists: never
   render empty, and never imply there is less here than there is. */
.tgal-sum{display:none}
@container tile (max-height:120px){
  .tgal{display:none}
  .tgal-sum{display:block}
}
@container tile (max-width:150px){ .tgal-sum .long{display:none} }
@container tile (min-width:151px){ .tgal-sum .short{display:none} }

/* The pill NAMES the thing it opens, then reports its state underneath.
   It used to show only "Reorganize · 8×7", which tells you what the board is
   doing but never says that tapping it is how you change any of it — a status
   line masquerading as a control. The name is the accessible name of the button
   too, so a screen reader announces "Grid settings, collapsed" rather than
   reading out two values with no indication of what they belong to. */
.sheetbtn{display:none;align-items:center;justify-content:space-between;gap:12px;
  min-height:56px;padding:0 16px;border:0;background:none;cursor:pointer;
  font:inherit;color:var(--ink);border-radius:13px;width:100%;text-align:left}
.sheetbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sheetlabel{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.sheetname{font-family:var(--text);font-size:14.5px;font-weight:600;color:var(--ink);
  letter-spacing:-.01em;line-height:1.2}
/* the state stays, demoted: mono and muted, so it reads as a readout of the
   board rather than as a second label competing with the name */
.sheetstate{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.02em;
  line-height:1.3;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheetchev{flex:none;font-size:15px;color:var(--faint);line-height:1;
  transition:transform 260ms var(--ease-out)}

/* ---- mobile: the bar becomes a bottom sheet ----
   Wrapping the desktop bar to fit 44px targets produced a 233px blob on an
   812px screen — 29% of the display — showing exactly ONE setting at a time
   behind a 1/4 pager, sitting on top of the board it controls. Eleven controls'
   worth of chrome to expose one setting, on the page whose entire job is
   watching the board react.
   So on a phone the bar is not a bar. At rest it is a 56px pill that reads the
   live state, which earns its space even closed, and the board keeps 93% of the
   screen. Tapping it raises every setting at once — no tabs, no pager, nothing
   hidden — as full-width rows with the label on the left and the control on the
   right, which is the one layout where a 44px target costs no horizontal room
   at all. The board stays visible above it and keeps reacting while you adjust,
   which a full-screen settings page would have broken. */
@media (pointer:coarse),(max-width:760px){
  .controls{left:50%;bottom:10px;flex-direction:column;align-items:stretch;
    gap:0;padding:6px;border-radius:18px;flex-wrap:nowrap;
    width:min(430px,calc(100vw - 20px));max-height:calc(100vh - 120px);overflow-y:auto}
  .sheetbtn{display:flex}

  /* collapsed — the pill is the only thing showing */
  .controls .tabs,.controls .panes,.controls .pager,.controls .ctl.reset{display:none}

  /* raised — every setting, both groups, no tabs and no pager */
  html.sheet-open .controls .panes{display:block}
  html.sheet-open .controls .ctl.reset{display:flex}
  /* align-items:stretch, not the base rule's `center`: without it every row
     hugs its own content and centres, so the label column starts at a
     different x on each line and nothing lines up. */
  html.sheet-open .pane{display:flex;flex-direction:column;gap:0;align-items:stretch}
  html.sheet-open .pane .ctl[data-off]{display:flex}   /* paging is off here */
  html.sheet-open .sheetchev{transform:rotate(180deg)}

  /* A setting is a full-width row, everything LEFT ALIGNED: the label sits in a
     fixed-width column so every input starts at the same x down the whole sheet.
     Pushing controls to the right edge instead put a different amount of dead
     space in every row and gave the eye no line to follow. */
  .ctl{justify-content:flex-start;gap:12px;padding:7px 8px;min-height:52px;
    border-left:0 !important}
  .ctl label{flex:none;width:96px}
  .ctl+.ctl,.controls .ctl.reset{border-left:0;border-top:1px solid var(--line-soft)}
  .ctl label{font-size:11.5px;letter-spacing:.07em}
  .step{gap:4px}
  .step button{width:44px;height:44px;font-size:19px;border-radius:11px}
  .step .val{min-width:40px;font-size:15.5px}
  select.mode{font-size:15px;padding:11px 12px;min-height:44px;border-radius:9px;
    max-width:58vw}
  .resetbtn{padding:13px 22px;font-size:13.5px;min-height:48px;border-radius:10px}
  .ctl.reset{padding-top:9px}
  /* the toast sits above the collapsed pill; the sheet covers it while open,
     which is fine — you are not reading toasts while setting up the board */
  .toast{bottom:84px}
}

/* ============================================================
   APPROVED TILE SPEC — Figma "Tile Ideation", sections 01-04
   (headline, foss, dek, cta), each annotated "ready for review".
   These rules deliberately come last and override the fluid cqi
   clamps above: the approved design is a FIXED type scale with a
   capped measure, not type that shrinks with its tile.
   ============================================================ */

/* The card is its own query container, so padding can respond to the tile's
   size without a container trying to query a box its own padding defines.
   .content keeps the `tile` container for content-box questions. */
.card{container:card / size}

/* Padding steps: 24 / 40 / 80, read off the approved sections. */
@container card (max-height:209px){ .content{padding:24px} }
@container card (min-height:210px){ .content{padding:40px} }
@container card (min-height:400px){ .content{padding:80px} }

/* Measure. Every text block stops at 400px — on the largest specimen the
   content box is 1292px wide and the type is still set to 400. Line length is
   an editorial constant here, not a function of the container. */
.content > *{max-width:400px}
@container card (min-height:600px){ .content > *{max-width:800px} }

/* Display type: three fixed steps, and the second line always sets smaller. */
[data-phase="grid"] .headline{font-size:24px;line-height:1.4;letter-spacing:-.67px}
[data-phase="grid"] .headline .br{font-size:20px}
@container card (min-height:400px){
  [data-phase="grid"] .headline{font-size:40px}
  [data-phase="grid"] .headline .br{font-size:32px}
}
@container card (min-height:600px){
  [data-phase="grid"] .headline{font-size:80px}
  [data-phase="grid"] .headline .br{font-size:64px}
}
/* Body: one size, everywhere, until the very largest tile doubles it. */
[data-phase="grid"] .subhead,[data-phase="grid"] .dek,
.applabel,.fval,.kv,.tcap{font-size:16px;line-height:1.5;letter-spacing:0}
@container card (min-height:600px){
  [data-phase="grid"] .subhead,[data-phase="grid"] .dek,.applabel,.fval{font-size:32px}
}
/* Mono: the licence line is 14, the download meta 12. */
[data-phase="grid"] .eyebrow{font-size:14px;line-height:1.5;letter-spacing:.18em}
.fkey{font-size:14px;line-height:1.5}
[data-phase="grid"] .meta{font-size:12px;line-height:1.5;text-align:left}
[data-phase="grid"] .cta{font-size:12px;height:34px}

/* ---- copy that changes with the tile, not just visibility ----
   The approved sections carry three lengths of the same sentence and show the
   one the width can hold. A tile too narrow for the full line gets a shorter
   TRUE sentence rather than the same sentence clipped or shrunk. */
.v-xs,.v-sm,.v-lg{display:none}
@container card (max-width:199px){ .v-xs{display:block} }
@container card (min-width:200px) and (max-width:379px){ .v-sm{display:block} }
@container card (min-width:380px){ .v-lg{display:block} }
/* dek's middle length runs a little longer before it needs the full sentence */
@container card (min-width:200px) and (max-width:329px){ .dek .v-sm{display:block} }
@container card (min-width:330px){ .dek .v-sm{display:none} .dek .v-lg{display:block} }
/* secondary affordances arrive only when the tile is tall enough to hold them */
.ondeep{display:none}
@container card (min-height:200px){ .ondeep{display:block} }
.ondeeper{display:none}
@container card (min-height:270px){ .ondeeper{display:flex} }

/* The download tile has its own gate, because below 200px the button LABEL is
   wider than the whole tile — there is no honest way to draw a call to action,
   so the narrowest form is the version string and nothing else. These cannot
   use .v-* because that forces display:block, which would flatten the button's
   inline-flex and drop its centring. */
.tinyonly,.notiny{display:none}
@container card (max-width:199px){ .tinyonly{display:block} }
@container card (min-width:200px){
  .notiny{display:block}
  a.cta.notiny{display:inline-flex}
}
/* ---- from the Figma iteration rounds (R1-R3, 78 specimens audited) ----

   1. PADDING HAS A FLOOR OF 24. An earlier round added an 8px step to rescue
      the 72-79px one-row tiles, whose content box was otherwise NEGATIVE. That
      solved the symptom and broke the system: 8px next to 24/40/80 reads as a
      mistake, which is exactly how it was flagged in review.
      The real fix is upstream — a tile is no longer allowed to BE that small
      (see MIN_TILE_H). 30px titlebar + 48px padding + one 24px line = 102px is
      the smallest honest tile, so nothing below it reaches this stylesheet and
      the floor can stay where the system says it should be. */

/* 2. The 400px measure is for PROSE. Applying it to the template gallery
      squeezed four thumbnails into one column and overflowed the tile by
      288px. A gallery is not a line of text and does not read like one. */
.content > .tgal{max-width:none}

/* 3. COMPLETENESS BEATS DETAIL. These rows are a list of OPTIONS, and dropping
      two of four does not say "there was no room" — it says "there are two
      modes", which is false. So the list never loses an item; the description
      gives way instead, in three steps:
        · roomy   — every option, full description
        · tighter — every option, short description
        · tight   — every option, name only, set inline as a wrapped list
      Names alone still carry the meaning here: Reorder, Shove, Overlap and
      Overflow each say what they do, which is what makes dropping the prose
      survivable and dropping a row not. */
@container tile (max-height:219px){ .fval .hi{display:none} .fval .lo{display:inline} }
@container tile (max-height:149px){
  .feat{flex-direction:row;flex-wrap:wrap;gap:5px 14px;align-items:baseline}
  .frow{display:contents}          /* lift the keys into the wrapped list */
  .fkey{width:auto}
  .fval{display:none}
}
/* 4. No tile may render empty. Below even a wrapped list of names the tile
      states its subject rather than listing what it cannot show. */
.feat-sum{display:none}
@container tile (max-height:59px){
  .feat .frow,.feat .fkey{display:none}
  .feat-sum{display:block}
}
@container tile (max-width:150px){ .feat-sum .long{display:none} }
@container tile (min-width:151px){ .feat-sum .short{display:none} }

/* Keys are capped at eight characters and the column is fixed, so a 14px mono
   label can never wrap. REORGANIZE measured 84px in an 80px column and broke
   across three lines; REORDER is 59px. */
.fkey{flex:none;width:84px;min-width:0}
@container tile (max-width:239px){
  .frow{flex-direction:column;gap:2px}
  .fkey{width:auto}
}
/* Values come in two lengths, like the approved sections' prose. */
.fval .lo{display:none}
@container tile (max-width:330px){ .fval .hi{display:none} .fval .lo{display:inline} }

/* the licence link: quiet, underlined on approach, never competing with the CTA */
.seelink{align-self:flex-start;font-family:var(--text);font-size:14px;line-height:1.4;
  color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;
  transition:border-color 160ms ease}
.seelink:hover{border-bottom-color:var(--accent-line)}
.seelink:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

@media (prefers-reduced-motion:reduce){
  .card,.headline,.dek,.eyebrow,.cta,.meta,.content{transition-duration:1ms !important}
  .rhandle{transition-duration:1ms !important}
}

<!-- Two tabs, and within a tab a pager rather than a drop. Nothing in here is
     ever unreachable at any width: that was the old bar's real bug, not its
     width — Gap and Corners were display:none below 1100px, so on a laptop you
     simply could not change them. -->
<div class="controls" id="controls" role="group" aria-label="Grid settings">

  </div>
  <div class="panes" id="panes">
    <div class="pane on" data-pane="layout" role="tabpanel">
      <div class="ctl"><label>Columns</label><div class="step">
        <button id="colsDec" aria-label="Fewer columns">−</button><span class="val" id="colsVal">12</span>
        <button id="colsInc" aria-label="More columns">+</button></div></div>
      <div class="ctl"><label>Rows</label><div class="step">
        <button id="rowsDec" aria-label="Fewer rows">−</button><span class="val" id="rowsVal">6</span>
        <button id="rowsInc" aria-label="More rows">+</button></div></div>
      <div class="ctl"><label>Gap</label><div class="step">
        <button id="gapDec" aria-label="Less gap">−</button><span class="val" id="gapVal">10px</span>
        <button id="gapInc" aria-label="More gap">+</button></div></div>
      <div class="ctl"><label>Corners</label><div class="step">
        <button id="radDec" aria-label="Squarer corners">−</button><span class="val" id="radVal">10px</span>
        <button id="radInc" aria-label="Rounder corners">+</button></div></div>
    </div>
    <div class="pane" data-pane="behaviour" role="tabpanel">
      <div class="ctl"><label>Re-order logic</label>
        <select class="mode" id="modeSel" aria-label="Re-order logic">
          <option value="reflow" selected>Reorganize</option>
          <option value="shove">Linear shove</option>
          <option value="griddle">Default</option>
          <option value="overlap">Overlap</option>
        </select></div>
      <!-- HIDDEN, NOT REMOVED: scroll-v, scroll-h and canvas.
           This page exists to demo the desktop app, and a setting the app cannot
           honour is a promise the product does not keep. Scrolling only means
           something when the board lives inside a viewport SMALLER than the
           board — which is true of this page and false of a desktop, where the
           monitor IS the viewport. There is nowhere to scroll to. The same goes
           for the canvas gestures built on top of it (drag-to-pan, Ctrl+wheel
           zoom): they move a viewport over a board, and a desktop has no such
           viewport to move.
           Everything implementing them is left intact and working — extent(),
           the carousel offset in cellRect, snapping, panning, zooming — because
           the layout engine genuinely expresses it and it returns the day the
           app can page the board across virtual desktops. Restoring it is
           deleting three `hidden` attributes. See docs/deferred.md. -->
      <div class="ctl"><label>Tile overflow</label>

          <option value="restrict">Restricted</option>

          <option value="scroll-h" hidden>Scroll horizontal</option>
          <option value="canvas" hidden>Canvas</option>

<script>
(function(){
'use strict';
const Grid=GriddleLib.Grid;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const root=document.documentElement;

/* ---- detail figures ----
   Drawn, not photographed. A diagram of a grid has to stay sharp at every size
   the popout can be (it is now the whole board, so that range is large) and has
   to follow the theme; a bitmap does neither. Every part is classed and coloured
   from the stylesheet, so light and dark cost one declaration, not two assets. */

/* The 4×1 fixture the placement-mode tests actually use: A(1 cell), B(2), C(1),
   on a board with exactly nothing to spare. That is the smallest board on which
   the three modes visibly disagree, which is the whole reason to draw it. */
function board4(tiles){
  const W=180,H=52,cw=W/4;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-hidden="true">`;
  for(let c=0;c<4;c++)s+=`<rect class="dcell" x="${c*cw+.5}" y=".5" width="${cw-1}" height="${H-1}" rx="3"/>`;
  for(const t of tiles){
    const x=t.col*cw+2.5,w=t.span*cw-5,dy=t.dy||0;
    s+=`<rect class="dtile${t.lit?' lit':''}" x="${x}" y="${2.5+dy}" width="${w}" height="${H-5}" rx="3"/>`
      +`<text class="${t.lit?'lit':''}" x="${x+w/2}" y="${H/2+3.5+dy}" text-anchor="middle">${t.name}</text>`;
  }
  return s+'</svg>';
}
function modeRow(label,tiles,note){
  return `<div class="dmode"><span class="dmlabel">${label}</span>${board4(tiles)}`
    +`<span class="dmnote">${note}</span></div>`;
}
/* One drop — A dragged onto B's left half — resolved three ways. Same board,
   same gesture, three outcomes: that comparison is the entire feature. */
function modesFig(){
  return '<figure class="dfig"><div class="dmodes">'
    +modeRow('Before',[{col:0,span:1,name:'A'},{col:1,span:2,name:'B'},{col:3,span:1,name:'C'}],
        'A is dragged onto B&rsquo;s left half')
    +modeRow('Reorganize',[{col:0,span:1,name:'C'},{col:1,span:1,name:'A',lit:1},{col:2,span:2,name:'B'}],
        'A takes the cell exactly; B and C reorganise')
    +modeRow('Tile shoving',[{col:0,span:1,name:'A',lit:1},{col:1,span:2,name:'B'},{col:3,span:1,name:'C'}],
        'B has nowhere to be shoved — the drop is refused')
    +modeRow('Overlap',[{col:0,span:1,name:'C',dy:0},{col:1,span:2,name:'B'},{col:1,span:1,name:'A',lit:1,dy:5}],
        'nothing moves; A simply lies on top')
    +'</div><p class="dcap">The same drop on the same full board. <b>Reorganize</b> is the only one that both honours your aim and keeps the board tidy.</p></figure>';
}
/* Four templates worth actually choosing.
   Halves, thirds and quarters are what a grid gives you for free by dragging two
   tiles together — putting them in a gallery is filler. These are the
   arrangements that are tedious to build by hand and that describe how people
   really lay a screen out: one thing you are working on and things you are
   watching, or a centre column flanked by rails.
   Authored against a 12x6 reference and scaled on apply, so each one means the
   same thing on a 4x3 board as on a 20x10 one. */
/* Each template carries ITS OWN dimensions, and applying one re-dimensions the
   grid to match. A template is a shape, not a set of proportions — squeezing
   "Cockpit" into whatever cols x rows happened to be set would round its rails
   to something that is no longer a cockpit. This is also what the desktop app
   does, and what the copy on this tile already promised. */
const TEMPLATES=[
  {id:'focus',name:'Focus + rail',cols:12,rows:6,
   blurb:'one thing you are working on, three you are watching',
   slots:[{col:0,row:0,w:8,h:6},{col:8,row:0,w:4,h:2},{col:8,row:2,w:4,h:2},{col:8,row:4,w:4,h:2}]},
  {id:'cockpit',name:'Cockpit',cols:14,rows:6,
   blurb:'a working centre, stacked rails either side — seven windows',
   slots:[{col:0,row:0,w:3,h:3},{col:0,row:3,w:3,h:3},
          {col:3,row:0,w:8,h:4},{col:3,row:4,w:8,h:2},
          {col:11,row:0,w:3,h:2},{col:11,row:2,w:3,h:2},{col:11,row:4,w:3,h:2}]},
  {id:'dashboard',name:'Dashboard',cols:12,rows:5,
   blurb:'a full-width banner over eight equal panels — the dense one',
   slots:[{col:0,row:0,w:12,h:1},
          {col:0,row:1,w:3,h:2},{col:3,row:1,w:3,h:2},{col:6,row:1,w:3,h:2},{col:9,row:1,w:3,h:2},
          {col:0,row:3,w:3,h:2},{col:3,row:3,w:3,h:2},{col:6,row:3,w:3,h:2},{col:9,row:3,w:3,h:2}]},
  {id:'mosaic',name:'Mosaic',cols:10,rows:5,
   blurb:'a deliberately uneven board, no two tiles the same',
   slots:[{col:0,row:0,w:6,h:3},
          {col:6,row:0,w:4,h:2},{col:6,row:2,w:4,h:1},{col:6,row:3,w:4,h:2},
          {col:0,row:3,w:3,h:2},{col:3,row:3,w:3,h:2}]},
];
/* Height follows the template's own aspect, so a 14x6 thumbnail is visibly wider
   than a 10x5 one — the gallery shows you the re-dimension before you click. */
function tplSvg(t,W){
  const H=Math.round(W*t.rows/t.cols);
  const cw=W/t.cols,ch=H/t.rows;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-hidden="true">`;
  for(const q of t.slots)
    s+=`<rect class="dtile lit" x="${q.col*cw+1}" y="${q.row*ch+1}" width="${q.w*cw-2}" height="${q.h*ch-2}" rx="2.5"/>`;
  return s+'</svg>';
}
/* Rendered from the same data in both places, so the thumbnail can never drift
   from the layout it applies. data-tpl is what the click delegate looks for. */
function tplButtons(cls,W,withBlurb){
  return TEMPLATES.map(t=>
    `<button type="button" class="${cls}" data-tpl="${t.id}" `
    +`title="Apply “${t.name}” — sets this grid to ${t.cols} × ${t.rows}">`
    +tplSvg(t,W)+`<span>${t.name}</span>`
    +(withBlurb?`<em>${t.blurb}</em><i>${t.cols} × ${t.rows}</i>`:'')+'</button>').join('');
}
function templatesFig(){
  return `<figure class="dfig"><div class="dtpls">${tplButtons('dtpl',132,1)}</div>`

}
/* Two screens of different heights, unioned into one board. The seam is the
   point: it is the part of the feature that surprises people. */
function monitorsFig(){
  return '<figure class="dfig"><svg viewBox="0 0 200 96" role="img" aria-hidden="true">'
    +'<rect class="dcell" x="1" y="1" width="118" height="94" rx="3"/>'

    +'<rect class="ddead" x="123" y="67" width="76" height="28" rx="3"/>'
    +'<text class="cap" x="60" y="14" text-anchor="middle">2560 × 1440</text>'
    +'<text class="cap" x="161" y="14" text-anchor="middle">1920 × 1080</text>'
    +'<text class="cap" x="161" y="84" text-anchor="middle">dead space</text>'
    +'<rect class="dtile lit" x="8" y="24" width="52" height="62" rx="3"/>'
    +'<rect class="dtile lit" x="66" y="24" width="47" height="30" rx="3"/>'
    +'<rect class="dtile lit" x="129" y="24" width="64" height="30" rx="3"/>'
    +'</svg><p class="dcap">One grid over the <b>union</b> of both work areas. Where the union is L-shaped, the cells no screen covers are excluded and windows snap to the nearest usable ones.</p></figure>';
}
/* Content authored ONCE, for the grid. The hero reuses these very nodes. */
const CARDS=[
  /* sm is 4×2, not 4×3: once a tile may not be shorter than 102px, the mobile

const solveMinimalMoves=GriddleLib.solveMinimalMoves;
/* `mode` is the RE-ORDER LOGIC — how the board rearranges around a drop.
   `ovf` is TILE OVERFLOW — what happens when that rearrangement needs room the
   board does not have. They are genuinely independent: every pair means
   something, except under Overlap, where nothing ever fails to fit. */
/* The DEFAULT board scales with the screen. 12x6 is a fine grid on a 27" and a
   nonsense one on a phone, where each cell would be about 30px across and every
   tile would be a truncated sliver. Fewer, bigger cells is what "responsive"
   means for a grid — not the same grid drawn smaller. Paired with tierLimit(),
   which decides how many tiles there are to place, this keeps the cell-per-tile
   ratio roughly constant across every screen. */
function defaultDims(){

  // dead column down the whole right-hand side. The board should be full.
  if(w<760)return{cols:4,rows:8};

   not exist on a 4-column grid, and clamping it to 4 while leaving its height at

   well as a wide one: same content, a shape that suits a column instead of a
   room. Chosen so the tier that survives at each width still fits the board it
   is given, which is what stops small screens from being a page of dropped
   tiles. */
function narrowBoard(){return cols<=6;}
/* PER-TILE FLOORS, AND ONLY WHERE THE CONTENT DEMANDS ONE.
   Most tiles carry an xs variant precisely so they can live at 1×1 — the licence
   line becomes "FOSS", the mode list becomes "4 modes", the download tile becomes
   its version string. Those shrink freely and declare nothing. A floor is the
   exception, not the rule, and it belongs to the tile whose content cannot
   reduce any further:

     monitors / local / safe   one whole sentence, no shorter form beyond the
                               xs variant — 30 titlebar + 48 padding + one 24px
                               line = 102px. These are the tiles flagged in
                               review, whose 72-79px specimens had a NEGATIVE
                               content box at the 24px padding floor.

     cta                       a 34px button it cannot usefully draw smaller, so 112.

   Stated in PIXELS and converted at the current cell size, because the same 1×1
   footprint is 138px tall on a 12×6 board and 79px on a 20×10 one — what the

   the whole reason not to grow the grid inside the same viewport. Instead the
   board keeps its cell metrics and extends PAST the edge, and this offset slides

   grows or shrinks around them, so zooming out is how you see a canvas that has

   desktop app and the app cannot honour them — a monitor is already the
   viewport, so a board that continues "past the edge" has nowhere to continue
   to. Nothing here is dead weight to delete: it is the working half of a feature
   waiting on virtual-desktop paging in the app. See docs/deferred.md.
   Everything below therefore still has to be correct, and the two shipped modes
   (`drop`, `restrict`) share all of it via extent() returning the visible page.

   How far past the visible page tiles may live, per overflow mode.
   The MIN floor matters more than the multiple: on a 1x1 board, "three times the
   page" is three cells, which is not a canvas by any reading. A floor of 16
   guarantees somewhere to explore at any grid size, and 16x16 cells is still a

    case 'scroll-h':return{c:grow(cols),r:rows};
    case 'canvas':  return{c:grow(cols),r:grow(rows)};

function scrollsY(){return ovf==='scroll-v'||ovf==='canvas';}
/* In the two carousels, never scroll past the last occupied cell: reachable
   empty space there reads as a broken board rather than a large one.

   the origin, which is what makes it explorable rather than merely tall. */
function scrollLimits(){
  const{uw,uh}=unit();
  let maxC=cols,maxR=rows;
  if(grid)for(const t of grid.tiles){
    if(t.col+t.w>maxC)maxC=t.col+t.w;

/* Captured once, at the size the visitor arrived at. Reset means "back to the

const DEFAULTS={...defaultDims(),gap:10,radius:10,mode:'reflow',ovf:'drop'};
cols=DEFAULTS.cols;rows=DEFAULTS.rows;
let seedKey='';
const els=new Map();
const stage=document.getElementById('stage'),gridwrap=document.getElementById('gridwrap'),

function panelRect(){const w=innerWidth,h=innerHeight,mx=Math.max(16,Math.min(64,w*.045));
  const top=68,bot=Math.min(86,h*.11);return{x:mx,y:top,w:w-mx*2,h:h-top-bot};}
function tierLimit(){const w=innerWidth,h=innerHeight;
  if(w<760||h<520)return 0; if(w<1060)return 1; if(w<1400)return 2; return 3;}
/* Every column is the same width and every row the same height. That is not a

   the only thing a resize can change is how many cells it spans. */
function unit(){const p=panelRect();

  // in px and shrinking it with the zoom would make a zoomed-out board look
  // fused together rather than smaller

  return{uw:((p.w-PAD*2-gap*(cols-1))/cols)*z,uh:((p.h-PAD*2-gap*(rows-1))/rows)*z,p};}

function cellRect(c,r,w,h){const{uw,uh,p}=unit();

function build(){
  for(const c of CARDS){
    const el=document.createElement('div');
    el.className='card'+(c.hero?' inhero':'');
    el.dataset.id=c.id;
    const tb=document.createElement('div');

    tb.innerHTML=`<span class="dot"${c.accent?` style="background:${c.accent}"`:''}></span>
      <span class="tbname">${c.app}</span><button class="closebtn" aria-label="Close">✕</button>`;
    const content=document.createElement('div');
    content.className='content';
    content.innerHTML=c.html||'';
    const det=document.createElement('div');
    det.className='detail';
    det.innerHTML=`<h2 class="dtitle">${c.title||c.app}</h2>${c.detail||'<p class="dbody">A window managed by Griddle. Drag it anywhere; its neighbours move out of the way.</p>'}`;
    const rh=document.createElement('button');

       hit exactly, and on the shortest tiles it is most of the tile anyway. The
       top third scales with the tile, so the grab area grows with the thing it
       grabs, and it never eats the resize grip in the bottom-right corner.
       Still floored at the titlebar height so a very short tile keeps a usable
       strip, and capped so a tall tile does not become almost entirely handle.

      if(e.target.closest('.rhandle,a,button,[data-tpl],select'))return;

/* Hero geometry is DERIVED. The headline card IS the intro window: it is sized to

   seat is a pure geometry change rather than a swap. The other three hero elements

  const EB=18, G1=26, G2=28;

/* Two passes, because pass one measures text that pass one itself just sized.

function seedGrid(){
  grid=newGrid();

    if(c.tier>lim)continue;
    const[sc,sr]=SEATS[c.id];
    const{w,h}=cardSize(c);

function renderCells(){
  const p=panelRect();
  gridwrap.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px`;
  const{uw,uh}=unit();const ex=extent();let s='';
  // the whole extent is drawn, not just the visible page — the cells past the
  // edge are what you scroll to, and .gridwrap clips them until you do
  for(let r=0;r<ex.r;r++)for(let c=0;c<ex.c;c++)
    s+=`<div class="cell" style="left:${PAD+c*(uw+gap)}px;top:${PAD+r*(uh+gap)}px;width:${uw}px;height:${uh}px"></div>`;
  cellsEl.innerHTML=s;

     the cells — tiles are children of .stage, which clips to the viewport, so a
     tile scrolled past the edge (or spilled into the carousel) painted across the
     whole page, over the header and out to the window edge.
     clip-path on the stage bounds every child at once — tiles, drop preview and

/* `step` staggers the tiles by reading order, so an arrangement assembles as a
   wave rather than lurching into place all at once. Every other caller passes
   nothing and gets zero delay — the stagger is for the one moment that earns it,
   the hero handing over to the grid. The delay is rewritten on every sync, so it
   can never leak into the next drag. */
/* The stagger is a DIAGONAL WAVE, not a list being processed.
   Delay comes from (row + col) — the tile's distance from the top-left corner in
   cells — rather than from its index in reading order. Index order makes the
   board animate like a spreadsheet recalculating, one row at a time; anti-
   diagonal order sweeps across it, which is the difference between "items
   updated" and "the layout moved". Tiles on the same diagonal share a delay and
   travel together, so the count of animation groups stays low however many tiles

  // delay it last carried and drags in late when it returns to the board
  for(const c of CARDS)if(!seen.has(c.id)){

}
/* ---- FLIP the hero type across the handover ----
   The card's BOX morphs beautifully — transform, width and height all

   change between the phases and none of them can be interpolated, so at the
   instant the phase flipped, every line of text jumped to its final alignment
   and then sat still for 820ms while the box travelled around it. That is the
   whole reason the handover read as the text vanishing and reappearing rather
   than as one card moving.
   FLIP is the standard answer: measure where the text was (First), let the
   layout change (Last), apply the inverse offset so it appears not to have moved
   (Invert), then animate that offset away (Play). The text ends up travelling
   with its card even though the property that moved it cannot animate.

   the headline is simultaneously running a CSS transition on font-size,
   line-height and letter-spacing, and writing element.style.transition here
   would blow all three away. WAAPI composites the transform independently. */

  if(reduce)return;

/* Every text node whose alignment differs between the two phases. */
function heroType(){
  return [...document.querySelectorAll(
    '.card.inhero .headline,.card.inhero .dek,.card.inhero .eyebrow,'+
    '.card.inhero .cta,.card.inhero .meta')]
    .map(n=>[n,n.getBoundingClientRect()]);

function start(){
  if(started)return;started=true;

     Cards paint in DOM order and the headline is built first, so it sits at the
     bottom of the pile: as the other nine fly out to their seats they pass in
     front of the very thing the eye is following. Lift the hero cards for the
     length of the handover and drop them back once everyone has landed. */
  const lead=[...document.querySelectorAll('.card.inhero')];
  for(const el of lead)el.classList.add('lifted');

  root.dataset.phase='grid';           // Last:  the alignment change lands here
  sync(reduce?1:820,reduce?0:38);

  requestAnimationFrame(()=>flipType(firstType,820));

   board, pushes whatever it overlaps out of the way, and rolls the whole thing
   back if no arrangement exists — returning false rather than a broken board.

   library answer. That is the point: the gesture on this page and the gesture in

/* Commit a resize. Griddle answers first; the whole-board repack is the same

function commitResize(id,w,h,snap){

/* ---- Overlap ----

   validated and rolled back on collision. So free overlap cannot be done by
   asking it nicely; it is done through the library's own escape hatch. A tile
   whose `position` is not static/relative/sticky is OUT OF FLOW: isInFlow()
   returns false for it, and both the overlap validator and tilesIn() skip it
   entirely. Marking every tile `absolute` therefore turns collision off at the
   source, using public API rather than reaching past it — the grid still clamps

function settleFromOverlap(){
  const cur=grid.tiles.map(t=>({...t})).sort((a,b)=>a.row-b.row||a.col-b.col);
  const pack=(list,authored)=>{

      const w=Math.min(authored&&c?c.w:t.w,cols),h=Math.min(authored&&c?c.h:t.h,rows);

     last: keep what the user built; then their authored sizes largest-first,
     because first-fit in reading order cannot tile a board with zero slack; then
     the seeded arrangement, which always fits because the page shipped with it.
     Losing a tile silently is the one outcome not on the list. */
  let r=pack(cur,false);

    const area=t=>{const c=CARDS.find(x=>x.id===t.id);return c?c.w*c.h:t.w*t.h;};
