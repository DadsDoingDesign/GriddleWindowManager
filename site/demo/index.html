<title>Griddle Window Manager</title>
<style>
:root{
  --ground:#FBFBFC; --panel:#F1F1F5; --surface:#FFFFFF; --surface-2:#FAFAFC;
  --ink:#0B0B12; --muted:#6E6E7A; --faint:#9C9CA8;
  --line:#E3E3EA; --line-soft:#EDEDF2;
  --accent:#5B5BD6; --accent-ink:#FFFFFF; --accent-soft:rgba(91,91,214,.10); --accent-line:rgba(91,91,214,.42);
  --shadow-lo:0 1px 2px rgba(11,11,18,.05), 0 1px 1px rgba(11,11,18,.03);
  --shadow-hi:0 18px 40px -12px rgba(11,11,18,.24), 0 4px 10px rgba(11,11,18,.08);
  --r:10px;
  --sans:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --text:"Segoe UI Variable Text","Segoe UI",-apple-system,system-ui,sans-serif;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#09090D; --panel:#121218; --surface:#1A1A22; --surface-2:#15151C;
    --ink:#F3F3F7; --muted:#9B9BA9; --faint:#6E6E7E;
    --line:#282833; --line-soft:#1F1F28;
    --accent:#8C8CF5; --accent-ink:#0A0A10; --accent-soft:rgba(140,140,245,.13); --accent-line:rgba(140,140,245,.5);
    --shadow-lo:0 1px 2px rgba(0,0,0,.5); --shadow-hi:0 20px 44px -12px rgba(0,0,0,.7), 0 4px 12px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#09090D; --panel:#121218; --surface:#1A1A22; --surface-2:#15151C;
  --ink:#F3F3F7; --muted:#9B9BA9; --faint:#6E6E7E;
  --line:#282833; --line-soft:#1F1F28;
  --accent:#8C8CF5; --accent-ink:#0A0A10; --accent-soft:rgba(140,140,245,.13); --accent-line:rgba(140,140,245,.5);
  --shadow-lo:0 1px 2px rgba(0,0,0,.5); --shadow-hi:0 20px 44px -12px rgba(0,0,0,.7), 0 4px 12px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --ground:#FBFBFC; --panel:#F1F1F5; --surface:#FFFFFF; --surface-2:#FAFAFC;
  --ink:#0B0B12; --muted:#6E6E7A; --faint:#9C9CA8;
  --line:#E3E3EA; --line-soft:#EDEDF2;
  --accent:#5B5BD6; --accent-ink:#FFFFFF; --accent-soft:rgba(91,91,214,.10); --accent-line:rgba(91,91,214,.42);
  --shadow-lo:0 1px 2px rgba(11,11,18,.05), 0 1px 1px rgba(11,11,18,.03);
  --shadow-hi:0 18px 40px -12px rgba(11,11,18,.24), 0 4px 10px rgba(11,11,18,.08);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--text);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- chrome ---------- */
.topbar{position:fixed;inset:0 0 auto 0;height:60px;display:flex;align-items:center;
  justify-content:space-between;padding:0 clamp(16px,3vw,40px);z-index:60;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--sans);font-weight:700;
  font-size:15px;letter-spacing:-.02em}
.mark{width:17px;height:17px;border:1.75px solid var(--ink);border-radius:4px;position:relative;flex:none}
.mark::after{content:"";position:absolute;left:1.5px;top:1.5px;width:6px;height:6px;
  background:var(--ink);border-radius:1.5px}
.navlinks{display:flex;align-items:center;gap:22px}
.navlink{font-size:13.5px;color:var(--muted);text-decoration:none;font-weight:500}
.navlink:hover{color:var(--ink)}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--muted);cursor:pointer;font-size:13px;padding:0}
.iconbtn:hover{color:var(--ink);border-color:var(--accent-line)}

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;overflow:hidden}
.card{position:absolute;left:0;top:0;border-radius:var(--r);background:var(--surface);
  will-change:transform,width,height;display:flex;flex-direction:column;overflow:hidden}
.card.chromed{border:1px solid var(--line);box-shadow:var(--shadow-lo)}
.card.hero-mode{background:transparent;border-color:transparent;box-shadow:none}
/* parked = staged off-canvas before the morph, or evicted by a grid resize */
.card.parked{opacity:0;pointer-events:none}

/* motion */
.anim{transition:transform var(--d,780ms) cubic-bezier(.22,1,.36,1),
  width var(--d,780ms) cubic-bezier(.22,1,.36,1),
  height var(--d,780ms) cubic-bezier(.22,1,.36,1),
  opacity 340ms ease, box-shadow 260ms ease, border-color 260ms ease, background 400ms ease}

.titlebar{height:30px;flex:none;display:flex;align-items:center;gap:9px;padding:0 12px;
  border-bottom:1px solid var(--line-soft);opacity:0;transition:opacity 300ms ease;
  cursor:grab;user-select:none;touch-action:none}
.card.chromed .titlebar{opacity:1}
.card.dragging .titlebar{cursor:grabbing}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}
.tbname{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;letter-spacing:.005em}
.tbhint{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint);
  opacity:0;transition:opacity 200ms ease;letter-spacing:.04em}
.card.chromed:hover .tbhint{opacity:1}

/* One card, three content states, always mounted — never re-rendered, so the
   morph is continuous. Only opacity cross-fades; geometry animates on .card. */
.body{position:relative;flex:1;min-height:0}
.st{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;
  justify-content:center;gap:10px;opacity:0;pointer-events:none;overflow:hidden;
  transition:opacity 260ms ease}
.card[data-state="hero"] .st-hero,
.card[data-state="tile"] .st-tile,
.card[data-state="detail"] .st-detail{opacity:1;pointer-events:auto}
.st-hero{padding:0;align-items:center;text-align:center;justify-content:center}
.st-detail{justify-content:flex-start;padding:26px 30px;overflow-y:auto;gap:14px}
.card.hero-mode .body{padding:0}

/* ---------- hero typography ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.19em;color:var(--accent);
  text-transform:uppercase;white-space:nowrap;font-weight:600}
.headline{font-family:var(--sans);font-weight:800;letter-spacing:-.045em;line-height:.94;
  font-size:clamp(38px,6.6vw,88px);margin:0;text-wrap:balance}
.headline .br{display:block}
.dek{font-size:clamp(14px,1.35vw,17.5px);line-height:1.5;color:var(--muted);margin:0;
  max-width:34em;text-wrap:pretty}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;
  padding:0 26px;border-radius:9px;background:var(--ink);color:var(--ground);
  font-family:var(--text);font-size:14.5px;font-weight:600;border:0;cursor:pointer;
  text-decoration:none;white-space:nowrap;transition:transform 160ms ease,filter 160ms ease}
.cta:hover{transform:translateY(-1px);filter:brightness(1.14)}
.cta:active{transform:translateY(0)}
.meta{font-size:11.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* in-grid text scales down */
.card.chromed .headline{font-size:clamp(19px,2.5vw,34px);letter-spacing:-.035em;line-height:1.02}
.card.chromed .dek{font-size:13px;line-height:1.45}
.card.chromed .eyebrow{font-size:10px;letter-spacing:.15em}
.card.chromed .cta{height:42px;padding:0 18px;font-size:13.5px}

/* fake app-window content */
.lines{display:flex;flex-direction:column;gap:7px;padding:2px 0}
.ln{height:7px;border-radius:4px;background:var(--line);opacity:.85}
.applabel{font-size:12px;color:var(--muted);line-height:1.45}

/* ---------- grid backdrop ---------- */
.gridwrap{position:absolute;border-radius:14px;background:var(--panel);opacity:0;
  transition:opacity 500ms ease;pointer-events:none}
.gridwrap.on{opacity:1}
.cells{position:absolute;inset:0}
.cell{position:absolute;border-radius:6px;border:1px dashed var(--line);opacity:.55}
.dropzone{position:absolute;border-radius:8px;background:var(--accent-soft);
  border:1.5px solid var(--accent-line);opacity:0;transition:opacity 140ms ease;pointer-events:none}
.dropzone.on{opacity:1}

/* ---------- controls ---------- */
.controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);
  display:flex;align-items:center;gap:4px;padding:7px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-hi);z-index:70;
  opacity:0;pointer-events:none;transition:opacity 400ms ease,transform 400ms cubic-bezier(.22,1,.36,1)}
.controls.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.ctl{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:8px}
.ctl+.ctl{border-left:1px solid var(--line-soft)}
.ctl label{font-size:10.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.09em;
  text-transform:uppercase}
.step{display:flex;align-items:center;gap:2px}
.step button{width:24px;height:24px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--muted);border-radius:6px;cursor:pointer;font-size:14px;line-height:1;padding:0;
  display:grid;place-items:center;font-family:var(--text)}
.step button:hover:not(:disabled){color:var(--ink);border-color:var(--accent-line)}
.step button:disabled{opacity:.35;cursor:default}
.step .val{min-width:24px;text-align:center;font-family:var(--mono);font-size:13px;
  font-variant-numeric:tabular-nums;font-weight:600}
.evicted{font-size:11px;color:var(--accent);font-family:var(--mono);white-space:nowrap;
  max-width:0;overflow:hidden;transition:max-width 400ms ease,padding 400ms ease;padding:0}
.evicted.on{max-width:190px;padding-right:8px}

/* ---------- expanded ---------- */
.scrim{position:fixed;inset:0;background:rgba(11,11,18,.34);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity 300ms ease;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.card.expanded{z-index:90;box-shadow:var(--shadow-hi);cursor:default}
.card.expanded .titlebar{cursor:default}
.card.expanded .body{justify-content:flex-start;padding:26px 30px;overflow-y:auto;gap:14px}
.detail{font-size:14.5px;line-height:1.62;color:var(--muted);max-width:60ch;margin:0}
.detail strong{color:var(--ink);font-weight:600}
.dtitle{font-family:var(--sans);font-size:23px;font-weight:750;letter-spacing:-.025em;margin:0}
.closebtn{margin-left:auto;width:22px;height:22px;border:0;background:transparent;color:var(--faint);
  cursor:pointer;font-size:15px;line-height:1;padding:0;display:none;place-items:center;border-radius:5px}
.card.expanded .closebtn{display:grid}
.closebtn:hover{color:var(--ink);background:var(--line-soft)}
.card.expanded .tbhint{display:none}

.skip{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);font-family:var(--mono);
  font-size:11px;color:var(--faint);letter-spacing:.06em;z-index:65;transition:opacity 300ms ease;
  background:none;border:0;cursor:pointer;padding:8px 12px}
.skip:hover{color:var(--muted)}
.skip.gone{opacity:0;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .anim{transition-duration:1ms !important}
  .controls{transition-duration:1ms}
}
</style>

<header class="topbar">
  <div class="brand"><span class="mark" aria-hidden="true"></span>Griddle</div>
  <nav class="navlinks">
    <a class="navlink" href="https://github.com/DadsDoingDesign/GriddleWindowManager" target="_blank" rel="noopener">GitHub</a>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">◐</button>
  </nav>
</header>

<main class="stage" id="stage">
  <div class="gridwrap" id="gridwrap"><div class="cells" id="cells"></div><div class="dropzone" id="dropzone"></div></div>
</main>

<button class="skip" id="skip">press any key to arrange &rarr;</button>

<div class="scrim" id="scrim"></div>

<div class="controls" id="controls" role="group" aria-label="Grid controls">
  <div class="ctl"><label for="colsDec">Columns</label>
    <div class="step"><button id="colsDec" aria-label="Fewer columns">−</button>
    <span class="val" id="colsVal">12</span>
    <button id="colsInc" aria-label="More columns">+</button></div></div>
  <div class="ctl"><label for="rowsDec">Rows</label>
    <div class="step"><button id="rowsDec" aria-label="Fewer rows">−</button>
    <span class="val" id="rowsVal">6</span>
    <button id="rowsInc" aria-label="More rows">+</button></div></div>
  <div class="ctl"><label for="gapDec">Gap</label>
    <div class="step"><button id="gapDec" aria-label="Less gap">−</button>
    <span class="val" id="gapVal">10</span>
    <button id="gapInc" aria-label="More gap">+</button></div></div>
  <span class="evicted" id="evicted"></span>
</div>

function appBody(c){
  const dots = c.lines.map(w=>`<div class="ln" style="width:${w}%"></div>`).join('');
  return `<div class="lines">${dots}</div>`;
}

/* ---------------- state ---------------- */
let cols=12, rows=6, gap=10;
const PAD=26;
let grid=null, expandedId=null, phase='hero';
const els=new Map(); // id -> {root, tb, body}
const stage=document.getElementById('stage');

function panelRect(){
  const w=innerWidth, h=innerHeight;
  const mx=Math.max(20, Math.min(72, w*0.05));
  const top=76, bot=94;
  return { x:mx, y:top, w:w-mx*2, h:h-top-bot };
}
function tierLimit(){
  const w=innerWidth;
  if(w<720) return 0;
  if(w<1040) return 1;
  if(w<1400) return 2;
  return 3;
}
function activeCards(){ const t=tierLimit(); return CARDS.filter(c=>c.tier<=t); }

function unit(){
  const p=panelRect();
  const uw=(p.w-PAD*2-gap*(cols-1))/cols;
  const uh=(p.h-PAD*2-gap*(rows-1))/rows;
  return {uw,uh,p};
}
function cellRect(col,row,w,h){
  const {uw,uh,p}=unit();
  return { x:p.x+PAD+col*(uw+gap), y:p.y+PAD+row*(uh+gap),
           w:uw*w+gap*(w-1), h:uh*h+gap*(h-1) };
}

  for(const c of CARDS){
    const root=document.createElement('div');
    root.className='card anim';
    root.dataset.id=c.id;
    const tb=document.createElement('div');
    tb.className='titlebar';
    tb.innerHTML=`<span class="dot" style="${c.accent?`background:${c.accent}`:''}"></span>
      <span class="tbname">${c.app}</span><span class="tbhint">drag · click to open</span>
      <button class="closebtn" aria-label="Close">✕</button>`;
    const body=document.createElement('div');
    body.className='body';
    const tileHtml = c.body || appBody(c);
    const mk=(cls,html)=>{const d=document.createElement('div');d.className='st '+cls;d.innerHTML=html;return d;};
    body.append(
      mk('st-hero', c.hero || tileHtml),
      mk('st-tile', tileHtml),
      mk('st-detail', `<h2 class="dtitle">${c.title||c.app}</h2>${c.detail||'<p class="detail">A window managed by Griddle. Drag it anywhere on the grid; its neighbours move out of the way.</p>'}`)
    );
    root.dataset.state='hero';
    root.append(tb,body);
    stage.append(root);
    els.set(c.id,{root,tb,body,spec:c});
    tb.addEventListener('pointerdown',e=>onDragStart(e,c.id));
    tb.addEventListener('click',e=>{
      if(e.target.closest('.closebtn')){ collapse(); return; }
      if(!didDrag) toggleExpand(c.id);
    });
    root.addEventListener('click',e=>{
      if(phase!=='grid') return;
      if(e.target.closest('a,button')) return;
      if(expandedId===c.id) return;
      if(!didDrag && !e.target.closest('.titlebar')) toggleExpand(c.id);
    });
  }
}

function place(id,r,opts){
  const e=els.get(id); if(!e) return;
  e.root.style.transform=`translate(${r.x}px,${r.y}px)`;
  e.root.style.width=r.w+'px';
  e.root.style.height=r.h+'px';
  if(opts&&opts.d!==undefined) e.root.style.setProperty('--d',opts.d+'ms');
}

/* ---------------- hero layout ---------------- */
function layoutHero(){
  const W=innerWidth,H=innerHeight;
  const cw=Math.min(1000,W-56);
  const cx=(W-cw)/2;
  const sizes={
    foss:{w:cw,h:20},
    headline:{w:cw,h:Math.min(190,H*0.26)},
    dek:{w:Math.min(680,cw),h:64},
    cta:{w:Math.min(420,cw),h:84},
  };
  const gapY=[22,26,30];
  const total=sizes.foss.h+gapY[0]+sizes.headline.h+gapY[1]+sizes.dek.h+gapY[2]+sizes.cta.h;
  let y=(H-total)/2;
  const order=['foss','headline','dek','cta'];
  order.forEach((id,i)=>{
    const s=sizes[id];
    place(id,{x:(W-s.w)/2,y,w:s.w,h:s.h});
    y+=s.h+(gapY[i]||0);
  });
  // non-hero cards wait above the fold, invisible
  for(const c of CARDS){
    if(order.includes(c.id)) continue;
    const e=els.get(c.id);
    e.root.classList.add('parked');
    place(c.id,{x:W/2-120,y:-200,w:240,h:150});
  }
  for(const id of order) els.get(id).root.classList.add('hero-mode');
}

/* ---------------- grid layout ---------------- */
function seedGrid(){
  const {uw,uh}=unit();
  grid=new Grid({cols,rows,unitWidth:Math.max(1,uw),unitHeight:Math.max(1,uh)});
  // 12x6 = 72 cells; the full set packs it exactly, smaller tiers leave room to drag into
  const seats=[
    ['headline',0,0],['vscode',5,0],['chrome',9,0],
    ['dek',0,3],['cta',4,3],['figma',8,3],
    ['foss',0,5],['local',3,5],['safe',6,5],['slack',9,5],
  ];
  const active=new Set(activeCards().map(c=>c.id));
  for(const [id,col,row] of seats){
    if(!active.has(id)) continue;
    const c=CARDS.find(x=>x.id===id);
    const w=Math.min(c.w,cols), h=Math.min(c.h,rows);
    const t={id,col:Math.min(col,cols-w),row:Math.min(row,rows-h),w,h};
    if(!grid.addTileWithDisplacement(t)){ /* no room; card stays hidden */ }
  }
}

function renderCells(){
  const p=panelRect();
  gridwrap.style.left=p.x+'px'; gridwrap.style.top=p.y+'px';
  gridwrap.style.width=p.w+'px'; gridwrap.style.height=p.h+'px';
  cellsEl.innerHTML='';
  const {uw,uh}=unit();
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const d=document.createElement('div');
    d.className='cell';
    d.style.left=(PAD+c*(uw+gap))+'px'; d.style.top=(PAD+r*(uh+gap))+'px';
    d.style.width=uw+'px'; d.style.height=uh+'px';
    cellsEl.append(d);
  }
}

function syncTiles(dur){
  const placed=new Set();
  for(const t of grid.tiles){
    placed.add(t.id);
    const e=els.get(t.id); if(!e) continue;
    e.root.classList.remove('parked');
    e.root.classList.add('chromed');
    e.root.classList.remove('hero-mode');
    if(expandedId!==t.id) place(t.id,cellRect(t.col,t.row,t.w,t.h),{d:dur});
  }
  for(const c of CARDS){
    if(placed.has(c.id)) continue;
    const e=els.get(c.id);
    e.root.classList.add('parked');
    e.root.classList.remove('chromed');
  }
}

function setState(id,state){
  const e=els.get(id); if(e) e.root.dataset.state=state;
}
function swapToGridContent(){
  for(const c of CARDS) setState(c.id,'tile');
}

/* ---------------- the morph ---------------- */
let started=false;
function start(){
  if(started) return; started=true;
  skipBtn.classList.add('gone');
  seedGrid();
  renderCells();
  gridwrap.classList.add('on');
  swapToGridContent();
  const dur=reduce?1:800;
  syncTiles(dur);
  setTimeout(()=>{ controls.classList.add('on'); phase='grid'; }, reduce?10:620);
}

/* ---------------- drag ---------------- */
let drag=null, didDrag=false;
function onDragStart(e,id){
  if(phase!=='grid'||expandedId) return;
  if(e.target.closest('.closebtn')) return;
  const t=grid.getTile(id); if(!t) return;
  const e2=els.get(id);
  didDrag=false;
  const r=cellRect(t.col,t.row,t.w,t.h);
  drag={id,tile:t,startX:e.clientX,startY:e.clientY,ox:e.clientX-r.x,oy:e.clientY-r.y,rect:r,target:{col:t.col,row:t.row}};
  e2.root.classList.add('dragging');
  e2.root.classList.remove('anim');
  e2.root.style.zIndex='50';
  e2.root.style.boxShadow='var(--shadow-hi)';
  e2.tb.setPointerCapture(e.pointerId);
  addEventListener('pointermove',onDragMove);
  addEventListener('pointerup',onDragEnd,{once:true});
}
function onDragMove(e){
  if(!drag) return;
  const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
  if(Math.abs(dx)>3||Math.abs(dy)>3) didDrag=true;
  const x=e.clientX-drag.ox, y=e.clientY-drag.oy;
  const el=els.get(drag.id);
  el.root.style.transform=`translate(${x}px,${y}px)`;
  const {uw,uh,p}=unit();
  let col=Math.round((x-p.x-PAD)/(uw+gap));
  let row=Math.round((y-p.y-PAD)/(uh+gap));
  col=Math.max(0,Math.min(cols-drag.tile.w,col));
  row=Math.max(0,Math.min(rows-drag.tile.h,row));
  drag.target={col,row};
  const dr=cellRect(col,row,drag.tile.w,drag.tile.h);
  dropzone.style.left=(dr.x-p.x)+'px'; dropzone.style.top=(dr.y-p.y)+'px';
  dropzone.style.width=dr.w+'px'; dropzone.style.height=dr.h+'px';
  dropzone.classList.add('on');
}
function onDragEnd(){
  if(!drag) return;
  removeEventListener('pointermove',onDragMove);
  dropzone.classList.remove('on');
  const el=els.get(drag.id);
  el.root.classList.remove('dragging');
  el.root.classList.add('anim');
  el.root.style.zIndex='';
  el.root.style.boxShadow='';
  grid.moveTile(drag.id,{col:drag.target.col,row:drag.target.row});
  drag=null;
  syncTiles(reduce?1:420);
  setTimeout(()=>{didDrag=false;},60);
}

/* ---------------- expand ---------------- */
function toggleExpand(id){
  if(expandedId===id){ collapse(); return; }
  if(expandedId) collapse(true);
  const e=els.get(id);
  if(!grid.getTile(id)) return;
  expandedId=id;
  setState(id,'detail');
  const W=innerWidth,H=innerHeight;
  const w=Math.min(620,W-64), h=Math.min(430,H-140);
  e.root.style.zIndex='90';
  e.root.classList.add('expanded');
  place(id,{x:(W-w)/2,y:(H-h)/2,w,h},{d:reduce?1:460});
  scrim.classList.add('on');
}
function collapse(quiet){
  if(!expandedId) return;
  const id=expandedId, e=els.get(id);
  expandedId=null;
  e.root.classList.remove('expanded');
  setState(id,'tile');
  const t=grid.getTile(id);
  if(t) place(id,cellRect(t.col,t.row,t.w,t.h),{d:reduce?1:460});
  setTimeout(()=>{ e.root.style.zIndex=''; },460);
  if(!quiet) scrim.classList.remove('on');
}

/* ---------------- controls ---------------- */
function flashEvicted(n){
  if(!n) return;
  evictedEl.textContent = n===1 ? '1 window did not fit' : `${n} windows did not fit`;
  evictedEl.classList.add('on');
  clearTimeout(flashEvicted._t);
  flashEvicted._t=setTimeout(()=>evictedEl.classList.remove('on'),2600);
}
function applyDims(nc,nr){
  const before=grid.tiles.length;
  const snapshot=grid.tiles.map(t=>({...t}));
  cols=nc; rows=nr;
  const {uw,uh}=unit();
  grid=new Grid({cols,rows,unitWidth:Math.max(1,uw),unitHeight:Math.max(1,uh)});
  let dropped=0;
  for(const t of snapshot){
    const w=Math.min(t.w,cols), h=Math.min(t.h,rows);
    const col=Math.max(0,Math.min(t.col,cols-w));
    const row=Math.max(0,Math.min(t.row,rows-h));
    if(!grid.addTileWithDisplacement({id:t.id,col,row,w,h})) dropped++;
  }
  document.getElementById('colsVal').textContent=cols;
  document.getElementById('rowsVal').textContent=rows;
  renderCells();
  syncTiles(reduce?1:520);
  flashEvicted(dropped);
  updateBtns();
}
function updateBtns(){
  document.getElementById('colsDec').disabled = cols<=4;
  document.getElementById('colsInc').disabled = cols>=20;
  document.getElementById('rowsDec').disabled = rows<=3;
  document.getElementById('rowsInc').disabled = rows>=10;
  document.getElementById('gapDec').disabled = gap<=0;
  document.getElementById('gapInc').disabled = gap>=28;
}
document.getElementById('colsInc').onclick=()=>applyDims(Math.min(20,cols+1),rows);
document.getElementById('colsDec').onclick=()=>applyDims(Math.max(4,cols-1),rows);
document.getElementById('rowsInc').onclick=()=>applyDims(cols,Math.min(10,rows+1));
document.getElementById('rowsDec').onclick=()=>applyDims(cols,Math.max(3,rows-1));
document.getElementById('gapInc').onclick=()=>{gap=Math.min(28,gap+2);document.getElementById('gapVal').textContent=gap;renderCells();syncTiles(reduce?1:380);updateBtns();};
document.getElementById('gapDec').onclick=()=>{gap=Math.max(0,gap-2);document.getElementById('gapVal').textContent=gap;renderCells();syncTiles(reduce?1:380);updateBtns();};

/* ---------------- theme ---------------- */
document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme:dark)').matches;
  const now = cur ? cur : (sysDark?'dark':'light');
  document.documentElement.setAttribute('data-theme', now==='dark'?'light':'dark');
};

/* ---------------- wiring ---------------- */
scrim.addEventListener('click',()=>collapse());
addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(expandedId) collapse(); return; }
  if(!started && !e.metaKey && !e.ctrlKey && !e.altKey){ start(); }
});
skipBtn.addEventListener('click',start);
stage.addEventListener('click',e=>{ if(!started && !e.target.closest('a,button')) start(); });

let rt;
addEventListener('resize',()=>{
  clearTimeout(rt);
  rt=setTimeout(()=>{
    if(!started){ layoutHero(); return; }
    renderCells();
    if(expandedId){ const c=els.get(expandedId);
      const W=innerWidth,H=innerHeight,w=Math.min(620,W-64),h=Math.min(430,H-140);
      place(expandedId,{x:(W-w)/2,y:(H-h)/2,w,h},{d:1}); }
    syncTiles(1);
  },120);
});

build();
layoutHero();
updateBtns();
// ?hold freezes the intro so the hero composition can be inspected; any key or click still starts it.
const hold=new URLSearchParams(location.search).has('hold');
if(reduce) start();
else if(!hold) setTimeout(()=>{ if(!started) start(); }, 2600);
})();
</script>
