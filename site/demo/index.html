<title>Griddle Window Manager</title>
<style>
:root{
  --ground:#FBFBFC; --panel:#F1F1F5; --surface:#FFFFFF; --surface-2:#FAFAFC;
  --ink:#0B0B12; --muted:#6E6E7A; --faint:#9C9CA8;
  --line:#E3E3EA; --line-soft:#EDEDF2;
  --accent:#5B5BD6; --accent-soft:rgba(91,91,214,.10); --accent-line:rgba(91,91,214,.45);
  --shadow-lo:0 1px 2px rgba(11,11,18,.05); --shadow-hi:0 18px 44px -12px rgba(11,11,18,.26),0 4px 10px rgba(11,11,18,.08);
  --card-radius:10px;
  --sans:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --text:"Segoe UI Variable Text","Segoe UI",-apple-system,system-ui,sans-serif;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1); --dur:820ms;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#09090D; --panel:#121218; --surface:#1A1A22; --surface-2:#15151C;
  --ink:#F3F3F7; --muted:#9B9BA9; --faint:#6E6E7E; --line:#282833; --line-soft:#1F1F28;
  --accent:#8C8CF5; --accent-soft:rgba(140,140,245,.14); --accent-line:rgba(140,140,245,.5);
  --shadow-lo:0 1px 2px rgba(0,0,0,.5); --shadow-hi:0 20px 48px -12px rgba(0,0,0,.72),0 4px 12px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --ground:#09090D; --panel:#121218; --surface:#1A1A22; --surface-2:#15151C;
  --ink:#F3F3F7; --muted:#9B9BA9; --faint:#6E6E7E; --line:#282833; --line-soft:#1F1F28;
  --accent:#8C8CF5; --accent-soft:rgba(140,140,245,.14); --accent-line:rgba(140,140,245,.5);
  --shadow-lo:0 1px 2px rgba(0,0,0,.5); --shadow-hi:0 20px 48px -12px rgba(0,0,0,.72),0 4px 12px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --ground:#FBFBFC; --panel:#F1F1F5; --surface:#FFFFFF; --surface-2:#FAFAFC;
  --ink:#0B0B12; --muted:#6E6E7A; --faint:#9C9CA8; --line:#E3E3EA; --line-soft:#EDEDF2;
  --accent:#5B5BD6; --accent-soft:rgba(91,91,214,.10); --accent-line:rgba(91,91,214,.45);
  --shadow-lo:0 1px 2px rgba(11,11,18,.05); --shadow-hi:0 18px 44px -12px rgba(11,11,18,.26),0 4px 10px rgba(11,11,18,.08);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--text);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.topbar{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;
  justify-content:space-between;padding:0 clamp(14px,3vw,34px);z-index:60;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:700;font-size:14.5px;letter-spacing:-.02em}
.mark{width:16px;height:16px;border:1.7px solid var(--ink);border-radius:4px;position:relative;flex:none}
.mark::after{content:"";position:absolute;left:1.4px;top:1.4px;width:5.5px;height:5.5px;background:var(--ink);border-radius:1.5px}
.navlinks{display:flex;align-items:center;gap:16px}
.navlink{font-size:13px;color:var(--muted);text-decoration:none;font-weight:500}
.navlink:hover{color:var(--ink)}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--muted);cursor:pointer;font-size:12px;padding:0}
.iconbtn:hover{color:var(--ink);border-color:var(--accent-line)}

.stage{position:fixed;inset:0;overflow:hidden}

/* ============================================================
   ONE component per card. Content is authored once, for the GRID.
   The hero is the same nodes with different geometry and type
   scale — never a second copy — so nothing cross-fades or ghosts.
   ============================================================ */
.card{position:absolute;left:0;top:0;border-radius:var(--card-radius);overflow:hidden;
  display:flex;flex-direction:column;background:var(--surface);
  border:1px solid transparent;will-change:transform,width,height;
  transition:transform var(--dur) var(--ease),width var(--dur) var(--ease),
    height var(--dur) var(--ease),opacity 380ms ease,
    background 620ms ease,border-color 620ms ease,box-shadow 620ms ease}
.card.parked{opacity:0;pointer-events:none}

/* hero phase: chrome dissolves, card becomes bare type on the page */
[data-phase="hero"] .card.inhero{background:transparent;border-color:transparent;box-shadow:none}
[data-phase="grid"] .card{border-color:var(--line);box-shadow:var(--shadow-lo)}

/* ...except the headline, which IS the intro window. It keeps its chrome while
   floating over an empty grid, then minimises into its own tile. The three other
   hero elements ride inside it and fly out to their own seats. */
[data-phase="hero"] .card.inhero[data-id="headline"]{background:var(--surface);
  border-color:var(--line);box-shadow:var(--shadow-hi)}

.titlebar{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 11px;
  border-bottom:1px solid transparent;opacity:0;transition:opacity 420ms ease,border-color 620ms ease;
  cursor:grab;user-select:none;touch-action:none}
[data-phase="grid"] .titlebar{opacity:1;border-bottom-color:var(--line-soft)}
[data-phase="hero"] .card.inhero .titlebar{height:0;overflow:hidden}
[data-phase="hero"] .card.inhero[data-id="headline"] .titlebar{height:30px;overflow:visible;
  opacity:1;border-bottom-color:var(--line-soft)}
.card.dragging .titlebar{cursor:grabbing}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}
.tbname{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.closebtn{margin-left:auto;width:21px;height:21px;border:0;background:transparent;color:var(--faint);
  cursor:pointer;font-size:14px;line-height:1;padding:0;display:none;place-items:center;border-radius:5px}
.card.expanded .closebtn{display:grid}
.closebtn:hover{color:var(--ink);background:var(--line-soft)}

/* padding tracks viewport height so single-row tiles never crop their text */
.content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;
  gap:clamp(4px,.8vh,8px);padding:clamp(6px,1.3vh,14px) clamp(10px,1.1vw,14px);
  overflow:hidden;transition:padding var(--dur) var(--ease)}
[data-phase="hero"] .card.inhero .content{padding:0;align-items:center;text-align:center;gap:0}
/* The intro group is centred as a whole, not hung off a centred headline, so the
   space above the eyebrow and below the description stays balanced. JS measures
   the real text and sets --hero-top. */
[data-phase="hero"] .card.inhero[data-id="headline"] .content{
  justify-content:flex-start;padding:var(--hero-top,0px) clamp(16px,3vw,48px) 0}

/* Type scales between phases on the SAME nodes — no duplicate text. */
.headline{font-family:var(--sans);font-weight:800;letter-spacing:-.042em;line-height:1.0;
  margin:0;text-wrap:balance;transition:font-size var(--dur) var(--ease),line-height var(--dur) var(--ease)}
/* vh term keeps the intro type from outgrowing the window on short viewports */
[data-phase="hero"] .headline{font-size:clamp(30px,min(5.6vw,11.5vh),76px);line-height:.95;letter-spacing:-.048em}
[data-phase="grid"] .headline{font-size:clamp(15px,1.85vw,27px);line-height:1.08}
.headline .br{display:block}

.dek{color:var(--muted);margin:0;text-wrap:pretty;overflow:hidden;
  transition:font-size var(--dur) var(--ease)}
[data-phase="hero"] .dek{font-size:clamp(13.5px,1.3vw,17px);line-height:1.5;max-width:32em}
[data-phase="grid"] .dek{font-size:clamp(11px,.92vw,13px);line-height:1.42}

.eyebrow{font-family:var(--mono);color:var(--accent);text-transform:uppercase;font-weight:600;
  white-space:nowrap;transition:font-size var(--dur) var(--ease),letter-spacing var(--dur) var(--ease)}
[data-phase="hero"] .eyebrow{font-size:clamp(9.5px,.78vw,11px);letter-spacing:.2em}
[data-phase="grid"] .eyebrow{font-size:clamp(8.5px,.68vw,10px);letter-spacing:.13em}

.cta{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
  background:var(--ink);color:var(--ground);font-weight:600;border:0;cursor:pointer;
  text-decoration:none;white-space:nowrap;align-self:center;
  transition:height var(--dur) var(--ease),padding var(--dur) var(--ease),
    font-size var(--dur) var(--ease),filter 160ms ease}
[data-phase="hero"] .cta{height:50px;padding:0 24px;font-size:14.5px}
[data-phase="grid"] .cta{height:34px;padding:0 14px;font-size:12.5px}
.cta:hover{filter:brightness(1.15)}
.meta{font-family:var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:center;transition:font-size var(--dur) var(--ease)}
[data-phase="hero"] .meta{font-size:11px}
[data-phase="grid"] .meta{font-size:9.5px}

.lines{display:flex;flex-direction:column;gap:6px}
.ln{height:6px;border-radius:3px;background:var(--line)}
.applabel{font-size:11.5px;color:var(--muted);line-height:1.4;overflow:hidden}
.applabel b{color:var(--ink);font-weight:650}

/* detail layer — genuinely different content, so it is an overlay that
   fades in over the same card rather than replacing anything */
.detail{position:absolute;inset:0;background:var(--surface);padding:24px 28px;
  display:flex;flex-direction:column;gap:12px;overflow-y:auto;opacity:0;pointer-events:none;
  transition:opacity 280ms ease}
.card.expanded .detail{opacity:1;pointer-events:auto}
.card.expanded{z-index:90;box-shadow:var(--shadow-hi)}
.card.expanded .titlebar{cursor:default}
.dtitle{font-family:var(--sans);font-size:21px;font-weight:750;letter-spacing:-.025em;margin:0}
.dbody{font-size:14px;line-height:1.6;color:var(--muted);margin:0}
.dbody b{color:var(--ink);font-weight:600}

.gridwrap{position:absolute;border-radius:13px;background:var(--panel);opacity:0;
  transition:opacity 620ms ease;pointer-events:none}
[data-phase="grid"] .gridwrap{opacity:1}
/* the intro floats over the empty grid rather than a blank page — it has to be
   legible enough to read as a grid, or the morph has nothing to land in */
[data-phase="hero"] .gridwrap{opacity:.85}
.cell{position:absolute;border-radius:5px;border:1px dashed var(--line);opacity:.5}
/* in the grid phase every cell is covered by a card, so --line is enough contrast.
   In the intro the empty grid is the point, so it gets a brighter dash. */
[data-phase="hero"] .cell{border-color:var(--faint);opacity:.45}

/* column-boundary handles: drag to redistribute column width as fr ratios */
/* inside .gridwrap on purpose: cards paint above, so a boundary is only grabbable
   in the gutter where it is actually visible, and never over a card's titlebar */
.handles{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 300ms ease}
.handles.on{opacity:1}
.chandle{position:absolute;pointer-events:auto;cursor:col-resize;touch-action:none;
  border-radius:6px;background:transparent}
.chandle::after{content:"";position:absolute;left:50%;top:0;width:2px;height:100%;
  transform:translateX(-50%);background:var(--accent);border-radius:2px;
  opacity:0;transition:opacity 140ms ease}
.chandle:hover::after,.chandle:focus-visible::after,.chandle.grabbing::after{opacity:1}
.chandle:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dropzone{position:absolute;border-radius:7px;background:var(--accent-soft);
  border:1.5px solid var(--accent-line);opacity:0;transition:opacity 130ms ease;pointer-events:none}
.dropzone.on{opacity:1}

.controls{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(14px);
  display:flex;align-items:center;gap:3px;padding:6px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-hi);z-index:70;
  opacity:0;pointer-events:none;transition:opacity 420ms ease,transform 420ms var(--ease)}
.controls.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.ctl{display:flex;align-items:center;gap:6px;padding:3px 7px}
.ctl+.ctl{border-left:1px solid var(--line-soft)}
.ctl label{font-size:9.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.09em;text-transform:uppercase}
.step{display:flex;align-items:center;gap:1px}
.step button{width:22px;height:22px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--muted);border-radius:6px;cursor:pointer;font-size:13px;line-height:1;padding:0;display:grid;place-items:center}
.step button:hover:not(:disabled){color:var(--ink);border-color:var(--accent-line)}
.step button:disabled{opacity:.34;cursor:default}
.step .val{min-width:20px;text-align:center;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
select.mode{font-family:var(--text);font-size:12px;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:3px 6px;cursor:pointer}
.note{font-size:10.5px;color:var(--accent);font-family:var(--mono);white-space:nowrap;
  max-width:0;overflow:hidden;transition:max-width 400ms ease;padding:0}
.note.on{max-width:180px;padding-right:6px}

.scrim{position:fixed;inset:0;background:rgba(11,11,18,.34);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity 280ms ease;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}

.hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-family:var(--mono);
  font-size:10.5px;color:var(--faint);letter-spacing:.06em;z-index:65;background:none;border:0;
  cursor:pointer;padding:8px 12px;transition:opacity 300ms ease}
.hint.gone{opacity:0;pointer-events:none}

/* Controls earn their place by width. Mode/Columns/Rows are informative and always
   present; Gap and Corners are the fun ones and arrive last. */
@media (max-width:1279px){.ctl.tier-3{display:none}}
@media (max-width:1099px){.ctl.tier-2{display:none}}
@media (max-width:899px){.handles{display:none}}

@media (prefers-reduced-motion:reduce){
  .card,.headline,.dek,.eyebrow,.cta,.meta,.content{transition-duration:1ms !important}
  .handles{transition-duration:1ms !important}
}
</style>

<header class="topbar">
  <div class="brand"><span class="mark" aria-hidden="true"></span>Griddle</div>
  <nav class="navlinks">
    <a class="navlink" href="https://github.com/DadsDoingDesign/GriddleWindowManager" target="_blank" rel="noopener">GitHub</a>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle theme">◐</button>
  </nav>
</header>

<main class="stage" id="stage">
  <div class="gridwrap" id="gridwrap"><div id="cells"></div><div class="dropzone" id="dropzone"></div>
    <div class="handles" id="handles" role="group" aria-label="Column width handles"></div></div>
</main>

<button class="hint" id="hint">press any key to arrange &rarr;</button>
<div class="scrim" id="scrim"></div>

<div class="controls" id="controls" role="group" aria-label="Grid controls">
  <div class="ctl tier-0"><label>Grid responsiveness</label>
    <select class="mode" id="modeSel" aria-label="Grid responsiveness">
      <option value="reflow" selected>Reorganize · reflow</option>
      <option value="push">Push · displace neighbours</option>
      <option value="stack">Overlap · windows stack</option>
    </select></div>
  <div class="ctl tier-0"><label>Columns</label><div class="step">
    <button id="colsDec" aria-label="Fewer columns">−</button><span class="val" id="colsVal">12</span>
    <button id="colsInc" aria-label="More columns">+</button></div></div>
  <div class="ctl tier-0"><label>Rows</label><div class="step">
    <button id="rowsDec" aria-label="Fewer rows">−</button><span class="val" id="rowsVal">6</span>
    <button id="rowsInc" aria-label="More rows">+</button></div></div>
  <div class="ctl tier-2"><label>Gap</label><div class="step">
    <button id="gapDec" aria-label="Less gap">−</button><span class="val" id="gapVal">10px</span>
    <button id="gapInc" aria-label="More gap">+</button></div></div>
  <div class="ctl tier-3"><label>Corners</label><div class="step">
    <button id="radDec" aria-label="Squarer corners">−</button><span class="val" id="radVal">10px</span>
    <button id="radInc" aria-label="Rounder corners">+</button></div></div>
  <span class="note" id="note"></span>

<script>
(function(){

const Grid=GriddleLib.Grid;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const root=document.documentElement;

/* Content authored ONCE, for the grid. The hero reuses these very nodes. */
const CARDS=[
  { id:'headline', app:'Griddle Window Manager', tier:0, w:5, h:3, hero:1,
    html:'<h1 class="headline">Every window,<span class="br">right where it belongs.</span></h1>',
    title:'Every window, right where it belongs.',
    detail:'<p class="dbody">Windows 11 gives you halves and quarters. Griddle gives you a real grid — say 12 columns by 6 rows — and lets any window claim any rectangle of cells.</p><p class="dbody">Drag one and an overlay shows exactly where it lands and which neighbours it pushes. <b>Which is what you are doing right now</b> — this page runs the same layout engine the app does.</p>' },
  { id:'foss', app:'License', tier:0, w:3, h:1, hero:1,
    html:'<div class="eyebrow">Free · Open source · Windows 11</div>',
    title:'MIT licensed',
    detail:'<p class="dbody">Free and open source under the MIT licence. No account, no paid tier, no telemetry. The full source, the design specs, and the entire commit history are public.</p>' },
  { id:'dek', app:'What it does', tier:0, w:4, h:2, hero:1,
    html:'<p class="dek">A grid you design yourself — and every window exactly where you meant it to go.</p>',
    title:'What it does',
    detail:'<p class="dbody">Enable a grid on any monitor and every eligible window snaps into it. Save arrangements as <b>templates</b>, pin apps to their usual spot with <b>per-app defaults</b>, and restore your whole desktop at startup with <b>views</b>.</p>' },
  /* No `hero` flag on purpose: the intro is text only. A download button there is
     dead UI — any key or click starts the arrangement and carries it off, so it
     can never be clicked. It arrives as a real tile once the grid has landed. */
  { id:'cta', app:'Download', tier:0, w:4, h:2,
    html:'<a class="cta" href="https://github.com/DadsDoingDesign/GriddleWindowManager/releases/latest" target="_blank" rel="noopener">Download for Windows 11</a><div class="meta">v0.2.0 · 3.1 MB · x64</div>',
    title:'Download',
    detail:'<p class="dbody">Version 0.2.0, 3.1 MB, x64. Installs <b>per-user</b> — no administrator rights needed.</p><p class="dbody">The installer is not code-signed, so SmartScreen warns once: choose <b>More info → Run anyway</b>. That means Windows does not recognise the publisher, not that anything is wrong.</p>' },
  { id:'vscode', app:'Visual Studio Code', tier:1, w:4, h:3, lines:[76,52,64], accent:'#4A9EDB' },
  { id:'figma',  app:'Figma',  tier:1, w:4, h:2, lines:[68,46], accent:'#A259FF' },
  { id:'chrome', app:'Chrome', tier:2, w:3, h:3, lines:[60,40,50], accent:'#F5A623' },
  { id:'slack',  app:'Slack',  tier:3, w:3, h:1, lines:[62], accent:'#E01E5A' },
  { id:'local', app:'Privacy', tier:3, w:3, h:1,
    html:'<div class="applabel"><b>Stays on your machine.</b> No telemetry, no account.</div>',
    title:'It stays on your machine',
    detail:'<p class="dbody">No telemetry, no analytics, no account. Your window titles never leave your machine. The one network feature is an update check — <b>opt-in and off by default</b>.</p>' },
  { id:'safe', app:'Reversible', tier:3, w:3, h:1,
    html:'<div class="applabel"><b>Nothing is destroyed.</b> Turn a grid off, windows stay put.</div>',
    title:'Nothing is destroyed',
    detail:'<p class="dbody">Turn a grid off and every window stays exactly where it is. There is also a <b>Pause</b> switch in the tray — the panic button — which stops all tracking instantly.</p>' },
];
/* Download sits directly under the headline: the primary action stays adjacent to
   the claim rather than drifting into the middle of the board. */
const SEATS={headline:[0,0],vscode:[5,0],chrome:[9,0],cta:[0,3],dek:[4,3],figma:[8,3],
             foss:[0,5],local:[3,5],safe:[6,5],slack:[9,5]};

const solveMinimalMoves=GriddleLib.solveMinimalMoves;
let cols=12,rows=6,gap=10,radius=10,mode='reflow';
let colFr=Array.from({length:cols},()=>1);
const PAD=24;
let grid=null,expandedId=null,started=false,didDrag=false,drag=null;
const els=new Map();
const stage=document.getElementById('stage'),gridwrap=document.getElementById('gridwrap'),
      cellsEl=document.getElementById('cells'),dropzone=document.getElementById('dropzone'),
      controls=document.getElementById('controls'),scrim=document.getElementById('scrim'),
      hint=document.getElementById('hint'),note=document.getElementById('note'),
      handles=document.getElementById('handles');

function panelRect(){const w=innerWidth,h=innerHeight,mx=Math.max(16,Math.min(64,w*.045));
  const top=68,bot=Math.min(86,h*.11);return{x:mx,y:top,w:w-mx*2,h:h-top-bot};}
function tierLimit(){const w=innerWidth,h=innerHeight;
  if(w<760||h<520)return 0; if(w<1060)return 1; if(w<1400)return 2; return 3;}
/* uw is the MEAN column width. It seeds the engine (which wants one number) and
   nothing else — real column widths come from the fr ratios below. */
function unit(){const p=panelRect();
  return{uw:(p.w-PAD*2-gap*(cols-1))/cols,uh:(p.h-PAD*2-gap*(rows-1))/rows,p};}

/* Columns are fr ratios, not pixels. Dragging a boundary trades weight between
   exactly two neighbours and conserves their sum, so the total is invariant —
   dragging every boundary repeatedly cannot inflate the grid. Each column is
   additionally clamped around a mean of 1. */
const MIN_FR=.35, MAX_FR=3;
function frTotal(){const t=colFr.reduce((a,b)=>a+b,0);return t>0?t:cols;}
function colWidths(){const p=panelRect();
  const inner=p.w-PAD*2-gap*(cols-1),t=frTotal();
  return colFr.map(f=>inner*f/t);}
function colOffsets(){const ws=colWidths(),xs=[];let x=0;
  for(let i=0;i<cols;i++){xs.push(x);x+=ws[i]+gap;}
  return xs;}
function cellRect(c,r,w,h){const{uh,p}=unit(),ws=colWidths(),xs=colOffsets();
  let width=0;for(let i=c;i<c+w&&i<cols;i++)width+=ws[i];
  return{x:p.x+PAD+xs[c],y:p.y+PAD+r*(uh+gap),w:width+gap*(w-1),h:uh*h+gap*(h-1)};}

function build(){
  for(const c of CARDS){
    const el=document.createElement('div');
    el.className='card'+(c.hero?' inhero':'');
    el.dataset.id=c.id;
    const tb=document.createElement('div');
    tb.className='titlebar';
    tb.innerHTML=`<span class="dot"${c.accent?` style="background:${c.accent}"`:''}></span>
      <span class="tbname">${c.app}</span><button class="closebtn" aria-label="Close">✕</button>`;
    const content=document.createElement('div');
    content.className='content';
    content.innerHTML=c.html||`<div class="lines">${(c.lines||[]).map(w=>`<div class="ln" style="width:${w}%"></div>`).join('')}</div>`;
    const det=document.createElement('div');
    det.className='detail';
    det.innerHTML=`<h2 class="dtitle">${c.title||c.app}</h2>${c.detail||'<p class="dbody">A window managed by Griddle. Drag it anywhere; its neighbours move out of the way.</p>'}`;
    el.append(tb,content,det);
    stage.append(el);
    els.set(c.id,{el,tb});
    tb.addEventListener('pointerdown',e=>dragStart(e,c.id));
    el.addEventListener('click',e=>{
      if(e.target.closest('.closebtn')){collapse();return;}
      if(!started||didDrag||e.target.closest('a'))return;
      if(expandedId!==c.id)expand(c.id);
    });
  }
}
function place(id,r,d){const e=els.get(id);if(!e)return;
  if(d!==undefined)e.el.style.setProperty('--dur',d+'ms');
  e.el.style.transform=`translate(${r.x}px,${r.y}px)`;
  e.el.style.width=r.w+'px';e.el.style.height=r.h+'px';}

/* Hero geometry is DERIVED. The headline card IS the intro window: it is sized to
   a real rectangle of the grid it is about to fall into, so the transition to its
   seat is a pure geometry change rather than a swap. The other three hero elements
   are laid inside it, chromeless, and fly out to their own seats when the grid
   takes over. The stack is measured off the rendered headline box, so the type can
   scale freely without ever colliding with what sits under it. */
function layoutHero(){
  const{uh,p}=unit(),ws=colWidths(),xs=colOffsets();
  const c0=cols>=8?1:0, c1=cols>=8?cols-2:cols-1, rspan=Math.min(rows,5);
  let iw=0;for(let i=c0;i<=c1;i++)iw+=ws[i];
  iw+=gap*(c1-c0);
  const ix=p.x+PAD+xs[c0], iy=p.y+PAD, ih=uh*rspan+gap*(rspan-1);
  place('headline',{x:ix,y:iy,w:iw,h:ih},0);

  for(const c of CARDS){
    if(c.hero)continue;
    els.get(c.id).el.classList.add('parked');
    place(c.id,{x:ix+iw/2-120,y:iy+ih+80,w:240,h:140},0);
  }

  /* Heights are measured, never assumed: the description wraps to a different
     number of lines at every width, and a fixed height cropped it. */
  const EB=18, G1=26, G2=28;
  /* scrollHeight, not the bounding box: .dek and .headline are clipped by the very
     card we are sizing from them, so the box would feed its own clipped height
     back in and the text would stay cropped. A generous provisional height lets
     the copy lay out unclipped before it is measured. */
  const H=el=>Math.ceil(Math.max(el.getBoundingClientRect().height||0, el.scrollHeight||0));
  const put=()=>{
    const headEl=els.get('headline').el, hEl=headEl.querySelector('.headline');
    const dEl=els.get('dek').el.querySelector('.dek');
    if(!hEl||!dEl)return;
    const inner=iw-64, dekW=Math.min(560,inner);
    place('dek',{x:ix+(iw-dekW)/2,y:iy+30,w:dekW,h:240},0);
    const hh=H(hEl);
    const dh=Math.max(20,H(dEl))+2;
    const contentH=ih-30, groupH=EB+G1+hh+G2+dh;
    const top=Math.max(16,(contentH-groupH)/2);
    headEl.style.setProperty('--hero-top',(top+EB+G1)+'px');
    place('foss',{x:ix+32,y:iy+30+top,w:inner,h:EB},0);
    place('dek',{x:ix+(iw-dekW)/2,y:iy+30+top+EB+G1+hh+G2,w:dekW,h:dh},0);
  };
  put();requestAnimationFrame(put);
}
function seedGrid(){
  const{uw,uh}=unit();
  grid=new Grid({cols,rows,unitWidth:Math.max(1,uw),unitHeight:Math.max(1,uh)});
  const lim=tierLimit();
  for(const c of CARDS){
    if(c.tier>lim)continue;
    const[sc,sr]=SEATS[c.id];
    const w=Math.min(c.w,cols),h=Math.min(c.h,rows);
    grid.addTileWithDisplacement({id:c.id,col:Math.min(sc,cols-w),row:Math.min(sr,rows-h),w,h});
  }
}
function renderCells(){
  const p=panelRect();
  gridwrap.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px`;
  const{uh}=unit(),ws=colWidths(),xs=colOffsets();let s='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
    s+=`<div class="cell" style="left:${PAD+xs[c]}px;top:${PAD+r*(uh+gap)}px;width:${ws[c]}px;height:${uh}px"></div>`;
  cellsEl.innerHTML=s;
  placeHandles();
}
function sync(d){
  const seen=new Set();
  for(const t of grid.tiles){
    seen.add(t.id);
    const e=els.get(t.id);if(!e)continue;
    e.el.classList.remove('parked');
    if(expandedId!==t.id)place(t.id,cellRect(t.col,t.row,t.w,t.h),d);
  }
  for(const c of CARDS)if(!seen.has(c.id))els.get(c.id).el.classList.add('parked');
}
function start(){
  if(started)return;started=true;
  hint.classList.add('gone');
  seedGrid();renderCells();
  root.dataset.phase='grid';
  sync(reduce?1:820);
  /* the panel and the column handles are tools for a grid that exists — they wait
     until the arrangement has fully landed (--dur is 820ms) */
  setTimeout(()=>{controls.classList.add('on');handles.classList.add('on');},reduce?10:900);
}

/* ---- column width redistribution (fr, clamped, sum-conserving) ---- */
/* Handle nodes are reused, never re-created. Rebuilding them on every render would
   destroy the node the pointer has captured (or the keyboard has focused) halfway
   through the very interaction that triggered the render. */
function placeHandles(){
  if(!started){handles.innerHTML='';return;}
  if(handles.children.length!==cols-1){
    let s='';
    for(let i=0;i<cols-1;i++)
      s+=`<div class="chandle" role="separator" tabindex="0" data-i="${i}"`
        +` aria-label="Width between column ${i+1} and column ${i+2}"></div>`;
    handles.innerHTML=s;
  }
  const p=panelRect(),xs=colOffsets(),hit=Math.max(12,gap+8);
  [...handles.children].forEach((el,i)=>{
    el.style.left=(PAD+xs[i+1]-gap/2-hit/2)+'px';
    el.style.top=PAD+'px';
    el.style.width=hit+'px';
    el.style.height=(p.h-PAD*2)+'px';
    el.setAttribute('aria-valuenow',colFr[i].toFixed(2));
  });
}
function nudgeFr(i,delta){
  const a=colFr[i],b=colFr[i+1],sum=a+b;
  // clamping the pair AND conserving their sum is what stops repeated drags
  // from ratcheting the ratios upward
  const lo=Math.max(MIN_FR,sum-MAX_FR), hi=Math.min(MAX_FR,sum-MIN_FR);
  const na=Math.min(hi,Math.max(lo,a+delta));
  if(na===a)return false;
  colFr[i]=na;colFr[i+1]=sum-na;
  return true;
}
function frReadout(i){
  note.textContent=`${colFr[i].toFixed(2)}fr · ${colFr[i+1].toFixed(2)}fr`;
  note.classList.add('on');
}
handles.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.chandle');if(!h)return;
  e.preventDefault();
  const i=+h.dataset.i, startX=e.clientX, a0=colFr[i], b0=colFr[i+1];
  const inner=panelRect().w-PAD*2-gap*(cols-1), perPx=frTotal()/Math.max(1,inner);
  h.setPointerCapture(e.pointerId);h.classList.add('grabbing');
  frReadout(i);
  const move=ev=>{
    const want=a0+(ev.clientX-startX)*perPx;
    colFr[i]=a0;colFr[i+1]=b0;
    if(nudgeFr(i,want-a0)){renderCells();sync(0);}
    frReadout(i);
  };
  const up=()=>{
    h.removeEventListener('pointermove',move);
    h.classList.remove('grabbing');
    note.classList.remove('on');
    sync(reduce?1:200);
  };
  h.addEventListener('pointermove',move);
  h.addEventListener('pointerup',up,{once:true});
  h.addEventListener('pointercancel',up,{once:true});
});
handles.addEventListener('keydown',e=>{
  const h=e.target.closest('.chandle');if(!h)return;
  const i=+h.dataset.i;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    e.preventDefault();
    if(nudgeFr(i,e.key==='ArrowRight'?.08:-.08)){renderCells();sync(reduce?1:160);frReadout(i);
      setTimeout(()=>note.classList.remove('on'),1400);}
  }
});
handles.addEventListener('dblclick',e=>{
  const h=e.target.closest('.chandle');if(!h)return;
  const i=+h.dataset.i, sum=colFr[i]+colFr[i+1];
  colFr[i]=colFr[i+1]=sum/2;
  renderCells();sync(reduce?1:220);
});

function dragStart(e,id){
  if(!started||expandedId)return;
  const t=grid.getTile(id);if(!t)return;
  const el=els.get(id).el,r=cellRect(t.col,t.row,t.w,t.h);
  didDrag=false;
  drag={id,t,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.x,oy:e.clientY-r.y,to:{col:t.col,row:t.row}};
  el.classList.add('dragging');el.style.setProperty('--dur','0ms');
  el.style.zIndex='50';el.style.boxShadow='var(--shadow-hi)';
  addEventListener('pointermove',dragMove);addEventListener('pointerup',dragEnd,{once:true});
}
function dragMove(e){
  if(!drag)return;
  if(Math.abs(e.clientX-drag.sx)>3||Math.abs(e.clientY-drag.sy)>3)didDrag=true;
  const x=e.clientX-drag.ox,y=e.clientY-drag.oy;
  els.get(drag.id).el.style.transform=`translate(${x}px,${y}px)`;
  const{uw,uh,p}=unit();
  // columns are no longer uniform, so snap to the nearest column offset
  const xs=colOffsets(),rel=x-p.x-PAD;
  let col=0,best=Infinity;
  for(let i=0;i<=cols-drag.t.w;i++){const d=Math.abs(xs[i]-rel);if(d<best){best=d;col=i;}}
  const row=Math.max(0,Math.min(rows-drag.t.h,Math.round((y-p.y-PAD)/(uh+gap))));
  drag.to={col,row};
  const dr=cellRect(col,row,drag.t.w,drag.t.h);
  dropzone.style.cssText=`left:${dr.x-p.x}px;top:${dr.y-p.y}px;width:${dr.w}px;height:${dr.h}px`;
  dropzone.classList.add('on');
}
/* ---- reorder + repack ----
   The board is a reading order. A drop pins the dragged tile exactly where it was
   released and re-packs every other tile, in reading order, into the first slot
   that fits. Packing is constructive rather than a search, so it always yields a
   valid board — unlike exact placement, which needs a re-tiling that usually does
   not exist once the grid is fully packed. The price is that untouched tiles can
   travel: a tile that no longer fits the gap it used to hold gets leapfrogged by
   a smaller one. */
function overlaps(a,b){return a.col<b.col+b.w&&a.col+a.w>b.col&&a.row<b.row+b.h&&a.row+a.h>b.row;}
function firstFit(placed,w,h){
  for(let r=0;r<=rows-h;r++)for(let c=0;c<=cols-w;c++){
    const rect={col:c,row:r,w,h};
    if(!placed.some(p=>overlaps(rect,p)))return{col:c,row:r};
  }
  return null;
}
function reorderRepack(id,to){
  const lim=tierLimit();
  const onBoard=new Map(grid.tiles.map(t=>[t.id,{...t}]));
  const me=onBoard.get(id);
  if(!me)return null;
  const pinned={...me,col:to.col,row:to.row};
  if(pinned.col<0||pinned.row<0||pinned.col+pinned.w>cols||pinned.row+pinned.h>rows)return null;
  /* The roster is every card that belongs on the board at this size, not just the
     ones currently placed. Without that, an evicted tile is gone for good: the
     headline is 15 cells and will never find a 5x3 hole again once it is off. */
  const reading=CARDS.filter(c=>c.tier<=lim&&c.id!==id).map(c=>{
    const t=onBoard.get(c.id);
    return{id:c.id,tier:c.tier,w:Math.min(c.w,cols),h:Math.min(c.h,rows),
           row:t?t.row:Infinity,col:t?t.col:Infinity};
  }).sort((a,b)=>a.row-b.row||a.col-b.col||(a.id<b.id?-1:1));
  const pack=order=>{
    const placed=[pinned], evicted=[];
    for(const t of order){
      const pos=firstFit(placed,t.w,t.h);
      if(pos)placed.push({...t,...pos});else evicted.push(t.id);
    }
    return{placed,evicted};
  };
  // First-fit in reading order is predictable but a poor packer, and a bad fit
  // costs a whole tile. Try other orderings and keep the least damaging result.
  // Cost is weighted, not counted: tier 0 is the page's actual content, so losing
  // the headline is never an acceptable price for keeping two decorative tiles.
  const a=pack(reading);
  if(!a.evicted.length)return a;
  const tierOf=tid=>{const c=CARDS.find(x=>x.id===tid);return c?c.tier:9;};
  const cost=r=>r.evicted.reduce((s,eid)=>s+(tierOf(eid)===0?100:1),0);
  const cands=[a,
    pack(reading.slice().sort((x,y)=>y.w*y.h-x.w*x.h)),
    pack(reading.slice().sort((x,y)=>tierOf(x.id)-tierOf(y.id)||y.w*y.h-x.w*x.h))];
  return cands.reduce((best,c)=>cost(c)<cost(best)?c:best);
}
function applyLayout(placed){
  const{uw,uh}=unit();
  const g=new Grid({cols,rows,unitWidth:Math.max(1,uw),unitHeight:Math.max(1,uh)});
  for(const t of placed)g.addTile({id:t.id,col:t.col,row:t.row,w:t.w,h:t.h});
  grid=g;
}

/* An eviction is not permanent. Once a tile is off the board the minimal-move
   solver never reconsiders it — it only knows about tiles already placed — so the
   board would keep drifting emptier. After any successful drop, if a card that
   belongs on the board is missing, repack the whole thing (pinning the tile the
   user just placed) to make room for it again. */
function heal(){
  const lim=tierLimit();
  if(!CARDS.some(c=>c.tier<=lim&&!grid.getTile(c.id)))return;
  const t=grid.getTile(drag.id);
  if(!t)return;
  const rr=reorderRepack(drag.id,{col:t.col,row:t.row});
  if(rr)applyLayout(rr.placed);
}

function dragEnd(){
  if(!drag)return;
  removeEventListener('pointermove',dragMove);
  dropzone.classList.remove('on');
  const el=els.get(drag.id).el;
  el.classList.remove('dragging');el.style.zIndex='';el.style.boxShadow='';
  if(mode==='stack'){
    grid.moveTile(drag.id,drag.to);
    el.style.zIndex='40';
  } else if(mode==='reflow'){
    // Same solver the desktop app uses: land the dragged window exactly where
    // it was aimed and move as few neighbours as possible to make room.
    const others=grid.tiles.filter(t=>t.id!==drag.id).map(t=>({id:t.id,col:t.col,row:t.row,w:t.w,h:t.h}));
    const target={id:drag.id,col:drag.to.col,row:drag.to.row,w:drag.t.w,h:drag.t.h};
    const res=solveMinimalMoves(others,target,{cols,rows});
    if(res&&res.ok){
      // Apply the solved arrangement wholesale. Replaying it move-by-move would
      // re-run Griddle's own collision resolution on each step and land
      // somewhere else entirely — the plan is only valid as a complete state.
      const moved=new Map(res.moves.map(m=>[m.id,m]));
      const snap=grid.toJSON();
      snap.tiles=[...others.map(t=>{const m=moved.get(t.id);return m?{...t,col:m.col,row:m.row}:t;}),target];
      grid.loadJSON(snap);
      flashMoved(res.movedCount);
      heal();
    } else {
      // No exact re-tiling exists — which on a fully packed board is the common
      // case, not the exception. Reflow instead, so the drop always lands.
      const before=new Map(grid.tiles.map(t=>[t.id,t.col+','+t.row]));
      const rr=reorderRepack(drag.id,drag.to);
      if(rr){
        applyLayout(rr.placed);
        flashMoved(rr.placed.filter(t=>t.id!==drag.id&&before.get(t.id)!==t.col+','+t.row).length);
        flash(rr.evicted.filter(eid=>!grid.getTile(eid)).length);
      } else {
        grid.moveTile(drag.id,drag.to);
      }
    }
  } else {
    grid.moveTile(drag.id,drag.to);
  }
  drag=null;sync(reduce?1:440);
  setTimeout(()=>{didDrag=false;},60);
}
function expand(id){
  if(!grid.getTile(id))return;
  if(expandedId)collapse(true);
  expandedId=id;
  const el=els.get(id).el;
  el.classList.add('expanded');
  const W=innerWidth,H=innerHeight,w=Math.min(600,W-56),h=Math.min(400,H-120);
  place(id,{x:(W-w)/2,y:(H-h)/2,w,h},reduce?1:460);
  scrim.classList.add('on');
}
function collapse(quiet){
  if(!expandedId)return;
  const id=expandedId;expandedId=null;
  const el=els.get(id).el;
  el.classList.remove('expanded');
  const t=grid.getTile(id);
  if(t)place(id,cellRect(t.col,t.row,t.w,t.h),reduce?1:460);
  setTimeout(()=>{el.style.zIndex='';},470);
  if(!quiet)scrim.classList.remove('on');
}
function flashMoved(n){
  note.textContent = n===0 ? 'landed · nothing moved'
    : n===1 ? 'landed · 1 window moved' : `landed · ${n} windows moved`;
  note.classList.add('on');clearTimeout(flashMoved._t);
  flashMoved._t=setTimeout(()=>note.classList.remove('on'),2000);
}
function flash(n){
  if(!n)return;
  note.textContent=n===1?'1 window did not fit':`${n} windows did not fit`;
  note.classList.add('on');clearTimeout(flash._t);
  flash._t=setTimeout(()=>note.classList.remove('on'),2600);
}
function applyDims(nc,nr){
  const snap=grid.tiles.map(t=>({...t}));
  const prevFr=colFr;
  cols=nc;rows=nr;
  // keep the ratios the user set for the columns that survive; new columns join at 1fr
  colFr=Array.from({length:cols},(_,i)=>prevFr[i]!==undefined?prevFr[i]:1);
  const{uw,uh}=unit();
  grid=new Grid({cols,rows,unitWidth:Math.max(1,uw),unitHeight:Math.max(1,uh)});
  let dropped=0;
  for(const t of snap){
    const w=Math.min(t.w,cols),h=Math.min(t.h,rows);
    if(!grid.addTileWithDisplacement({id:t.id,col:Math.max(0,Math.min(t.col,cols-w)),row:Math.max(0,Math.min(t.row,rows-h)),w,h}))dropped++;
  }
  document.getElementById('colsVal').textContent=cols;
  document.getElementById('rowsVal').textContent=rows;
  renderCells();sync(reduce?1:520);flash(dropped);btns();
}
function btns(){
  document.getElementById('colsDec').disabled=cols<=4;
  document.getElementById('colsInc').disabled=cols>=20;
  document.getElementById('rowsDec').disabled=rows<=3;
  document.getElementById('rowsInc').disabled=rows>=10;
  document.getElementById('gapDec').disabled=gap<=0;
  document.getElementById('gapInc').disabled=gap>=28;
  document.getElementById('radDec').disabled=radius<=0;
  document.getElementById('radInc').disabled=radius>=22;
}
document.getElementById('colsInc').onclick=()=>applyDims(Math.min(20,cols+1),rows);
document.getElementById('colsDec').onclick=()=>applyDims(Math.max(4,cols-1),rows);
document.getElementById('rowsInc').onclick=()=>applyDims(cols,Math.min(10,rows+1));
document.getElementById('rowsDec').onclick=()=>applyDims(cols,Math.max(3,rows-1));
function setGap(v){gap=v;document.getElementById('gapVal').textContent=gap+'px';renderCells();sync(reduce?1:380);btns();}
document.getElementById('gapInc').onclick=()=>setGap(Math.min(28,gap+2));
document.getElementById('gapDec').onclick=()=>setGap(Math.max(0,gap-2));
function setRadius(v){radius=v;root.style.setProperty('--card-radius',radius+'px');
  document.getElementById('radVal').textContent=radius+'px';btns();}
document.getElementById('radInc').onclick=()=>setRadius(Math.min(22,radius+2));
document.getElementById('radDec').onclick=()=>setRadius(Math.max(0,radius-2));
document.getElementById('modeSel').onchange=e=>{mode=e.target.value;};
document.getElementById('themeBtn').onclick=()=>{
  const cur=root.getAttribute('data-theme');
  const sys=matchMedia('(prefers-color-scheme:dark)').matches;
  root.setAttribute('data-theme',(cur?cur:(sys?'dark':'light'))==='dark'?'light':'dark');
};
scrim.addEventListener('click',()=>collapse());
addEventListener('keydown',e=>{
  if(e.key==='Escape'){collapse();return;}
  if(!started&&!e.metaKey&&!e.ctrlKey&&!e.altKey)start();
});
hint.addEventListener('click',start);
stage.addEventListener('click',e=>{if(!started&&!e.target.closest('a,button'))start();});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if(!started){renderCells();layoutHero();return;}
  renderCells();
  if(expandedId){const W=innerWidth,H=innerHeight,w=Math.min(600,W-56),h=Math.min(400,H-120);
    place(expandedId,{x:(W-w)/2,y:(H-h)/2,w,h},1);}
  sync(1);
},130);});

root.dataset.phase='hero';
build();
renderCells();   // the intro floats over a real, empty grid — so it must exist first
requestAnimationFrame(()=>{layoutHero();
  requestAnimationFrame(()=>{for(const[,e]of els)e.el.style.removeProperty('--dur');});});
btns();
const hold=new URLSearchParams(location.search).has('hold');
if(reduce)start();else if(!hold)setTimeout(()=>{if(!started)start();},2400);
})();
</script>
