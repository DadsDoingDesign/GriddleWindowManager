[package]
name = "griddle-wm"
version = "0.2.0"
description = "Griddle Window Manager - a Windows 11 grid window manager"
authors = ["Griddle Window Manager contributors"]
license = "MIT"
edition = "2021"
# 1.81 minimum (security review): from 1.81 a panic reaching a non-unwind
# `extern "system"` boundary is a defined abort rather than undefined
# behavior. The callbacks additionally catch panics (src/ffi_guard.rs).
rust-version = "1.81"

[lib]
name = "griddle_wm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# Opt-in auto-update (v0.3 groundwork, default OFF — see the "Update checks"
# section of docs/security-review.md). The updater performs its HTTP from
# Rust; `tauri-plugin-process` supplies the relaunch the installer handoff
# needs.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  # Registry access for the Snap Layouts flyout toggle (snap.rs) — Windows
  # exposes no SystemParametersInfo action for it.
  "Win32_System_Registry",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_System_ProcessStatus",
] }
