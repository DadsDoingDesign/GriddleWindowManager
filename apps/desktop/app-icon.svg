<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Griddle Window Manager app icon (original artwork, 2026).
    Motif: a capital G built out of grid cells — the name is a play on "grid",
    and the tool makes grids, so the letterform is made of the same thing.

    Master geometry is a 150-unit square on a 4x4 grid: cell 33, gap 6,
    step 39. Stem = column 0, full height. Top bar = columns 0-2. Bottom bar
    = columns 0-1. Counter = columns 2-3 / rows 2-3, drawn as an outline.
    Radii: every convex corner 8, every concave corner 4 (half). The counter
    is outer 12 / stroke 8 / inner 4, so outer minus stroke equals the inner
    radius exactly and its centreline curves at the same rate as the bars.

    Source of truth for `npx tauri icon` (regenerates icons/*).
  -->
  <!-- plate -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#1A1A22"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="8"/>

  <!--
    Mark at 560 units (150 * 3.73333), nudged 12 right and 6 up from a
    bounding-box centre: the counter's open corner sits top-right, so a
    mathematically centred mark reads as leaning into the bottom-left.
  -->
  <g transform="translate(244 226) scale(3.73333)" fill="none">
    <path fill="#F3F3F7"
          d="M8 0 H103 A8 8 0 0 1 111 8 V25 A8 8 0 0 1 103 33 H37 A4 4 0 0 0 33 37
             V113 A4 4 0 0 0 37 117 H64 A8 8 0 0 1 72 125 V142 A8 8 0 0 1 64 150 H8
             A8 8 0 0 1 0 142 V8 A8 8 0 0 1 8 0 Z"/>
    <rect x="82" y="82" width="64" height="64" rx="8"
          stroke="#F3F3F7" stroke-width="8"/>
  </g>
</svg>
