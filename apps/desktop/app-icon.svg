<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Griddle WM app icon (original artwork, 2026).
    Motif: a snapped window layout — one tall main tile plus two stacked
    side tiles — on a dark plate, in the app's overlay accent purple.
    Source of truth for `npx tauri icon` (regenerates icons/*).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c303e"/>
      <stop offset="1" stop-color="#171a22"/>
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c46bff"/>
      <stop offset="1" stop-color="#9a36e8"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a98bff"/>
      <stop offset="1" stop-color="#7d5ae0"/>
    </linearGradient>
    <linearGradient id="tileC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8347e6"/>
      <stop offset="1" stop-color="#5f2bb8"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="8"/>

  <!-- faint grid lines of the underlying cells -->
  <g stroke="#b44dff" stroke-opacity="0.16" stroke-width="6">
    <line x1="212" y1="362" x2="812" y2="362"/>
    <line x1="212" y1="512" x2="812" y2="512"/>
    <line x1="212" y1="662" x2="812" y2="662"/>
    <line x1="362" y1="212" x2="362" y2="812"/>
    <line x1="512" y1="212" x2="512" y2="812"/>
    <line x1="662" y1="212" x2="662" y2="812"/>
  </g>

  <!-- snapped tiles: main + two stacked -->
  <rect x="212" y="212" width="332" height="600" rx="52" fill="url(#tileA)"/>
  <rect x="588" y="212" width="224" height="276" rx="44" fill="url(#tileB)"/>
  <rect x="588" y="536" width="224" height="276" rx="44" fill="url(#tileC)"/>

  <!-- top light catch on the main tile -->
  <rect x="212" y="212" width="332" height="600" rx="52" fill="none"
        stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>
</svg>
